<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Tainty Labs</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/common.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.loading-overlay,.topbar,.main{position:relative;z-index:1}

/* TOPBAR */
.topbar-right{display:flex;align-items:center;gap:10px}
.month-nav{display:flex;align-items:center;gap:8px}
.nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.month-label{font-family:'DM Mono',monospace;font-size:13px;color:var(--text);min-width:120px;text-align:center}
/* MAIN */
.main{padding:1.5rem}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-val{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--text)}
.stat-sub{font-size:12px;margin-top:4px}
.stat-up{color:var(--green)}
.stat-down{color:var(--red)}
.stat-neutral{color:var(--muted)}

/* CHARTS GRID */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem}
.chart-card.full{grid-column:1/-1}
.chart-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);margin-bottom:1rem}
.chart-wrap{position:relative;height:220px}

/* TABLES */
.tables-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem}
.table-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:1rem}
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-item{display:flex;align-items:center;gap:10px}
.rank-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--hint);width:20px;text-align:right;flex-shrink:0}
.rank-bar-wrap{flex:1;min-width:0}
.rank-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.rank-track{height:4px;background:var(--surface2);border-radius:2px}
.rank-fill{height:100%;border-radius:2px;transition:width .5s ease}
.rank-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex-shrink:0;text-align:right;min-width:60px}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.loading-overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
}
.loading-text{font-size:14px;color:var(--muted)}

@media(max-width:700px){
  .charts-grid,.tables-grid{grid-template-columns:1fr}
  .chart-card.full{grid-column:1}
}
@media(max-width:640px){
  .topbar{flex-wrap:wrap;gap:8px}
  .month-nav{order:2;width:100%;justify-content:center}

  .topbar{padding:.75rem 1rem;flex-wrap:wrap;gap:8px}
  .topbar .logo{font-size:13px}
  .month-nav{gap:5px}
  .month-label{font-size:12px;min-width:90px}
  .main{padding:1rem}
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-val{font-size:20px}
  .charts-grid{grid-template-columns:1fr}
  .chart-card.full{grid-column:1}
  .tables-grid{grid-template-columns:1fr}
  .chart-wrap{height:180px}
  .pin-card{padding:1.5rem;width:90vw;max-width:320px}
}
@media(min-width:641px) and (max-width:900px){
  .charts-grid{grid-template-columns:1fr}
  .chart-card.full{grid-column:1}
}

</style>
<script src="./assets/auth.js"></script>
<script src="./assets/config.js"></script>
<script src="./assets/common.js"></script>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Cargando datos...</div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">Tainty <span>Labs</span> · Analytics</div>
  <div class="topbar-right">
    <a href="./index.html" style="font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px">&#8592; Inicio</a>
    <div class="month-nav">
      <button class="nav-btn" onclick="cambiarMes(-1)">‹</button>
      <div class="month-label" id="month-label">—</div>
      <button class="nav-btn" onclick="cambiarMes(1)">›</button>
    </div>
    <button class="lock-btn" onclick="cerrarSesion()">🔒 Salir</button>
  </div>
</div>

<div class="main">
  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Pedidos del mes</div>
      <div class="stat-val" id="s-pedidos">—</div>
      <div class="stat-sub" id="s-pedidos-cmp"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Unidades vendidas</div>
      <div class="stat-val" id="s-unidades">—</div>
      <div class="stat-sub" id="s-unidades-cmp"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Monto total (S/)</div>
      <div class="stat-val" id="s-monto">—</div>
      <div class="stat-sub" id="s-monto-cmp"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Clientes únicos</div>
      <div class="stat-val" id="s-clientes">—</div>
      <div class="stat-sub" id="s-clientes-cmp"></div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="charts-grid">
    <div class="chart-card full">
      <div class="chart-title">Unidades vendidas — últimos 6 meses</div>
      <div class="chart-wrap"><canvas id="chart-meses"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Monto total — últimos 6 meses (S/)</div>
      <div class="chart-wrap"><canvas id="chart-monto"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Pedidos por estado este mes</div>
      <div class="chart-wrap"><canvas id="chart-estados"></canvas></div>
    </div>
  </div>

  <!-- RANKINGS -->
  <div class="tables-grid">
    <div class="table-card">
      <div class="table-title">🏆 Top productos del mes</div>
      <div class="rank-list" id="top-productos"></div>
    </div>
    <div class="table-card">
      <div class="table-title">👤 Top clientes del mes</div>
      <div class="rank-list" id="top-clientes"></div>
    </div>
  </div>
</div>

<script>

// Auth gate: si no hay sesion, requireLogin redirige al index.
if (!requireLogin()) {
  // El navegador ya esta yendo al index; lo siguiente no se ejecuta.
} else {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => cargarDatos());
  } else {
    cargarDatos();
  }
}
const MESES_ES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
let allRows=[];
let mesIdx=new Date().getMonth();
let anioIdx=new Date().getFullYear();
let charts={};

// JSONP
async function cargarDatos(){
  mostrarLoading('Cargando analytics...');
  try{
    const res=await jsonp(`${SCRIPT_URL}?action=analytics&t=${Date.now()}`);
    if(res.success&&res.rows){
      allRows=res.rows.map(r=>({
        ...r,
        cantidad:parseInt(r.cantidad)||0,
        montoTotal:parseFloat(r.montoTotal)||0,
        mesNorm:(r.mes||'').toString().toUpperCase().trim()
      }));
      renderDashboard();
    }
  }catch(e){
    mostrarToast('Error al conectar: ' + (e.message || 'sin detalle'), {type:'error',duration:3500});
  }
  ocultarLoading();
}

function getMesAnterior(){
  let m=mesIdx-1,a=anioIdx;
  if(m<0){m=11;a--;}
  return{m,a};
}

function rowsDelMes(m,a){
  const mesNom=MESES_ES[m];
  return allRows.filter(r=>{
    if(r.mesNorm===mesNom)return true;
    const f=parseFecha(r.fecha);
    if(!f||isNaN(f))return false;
    return f.getMonth()===m&&f.getFullYear()===a;
  });
}

function parseFecha(str){
  if(!str)return null;
  if(str instanceof Date)return str;
  const s=str.toString().trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  const d=new Date(s);return isNaN(d)?null:d;
}

function calcStats(rows){
  const pedidos=rows.length;
  const unidades=rows.reduce((s,r)=>s+r.cantidad,0);
  const monto=rows.reduce((s,r)=>s+r.montoTotal,0);
  const clientes=new Set(rows.map(r=>r.cliente)).size;
  return{pedidos,unidades,monto,clientes};
}

function cmpArrow(curr,prev){
  if(!prev||prev===0)return{txt:'Sin datos anteriores',cls:'stat-neutral'};
  const pct=Math.round(((curr-prev)/prev)*100);
  if(pct>0)return{txt:`▲ ${pct}% vs mes anterior`,cls:'stat-up'};
  if(pct<0)return{txt:`▼ ${Math.abs(pct)}% vs mes anterior`,cls:'stat-down'};
  return{txt:'Sin cambio vs mes anterior',cls:'stat-neutral'};
}

function renderDashboard(){
  document.getElementById('month-label').textContent=MESES_ES[mesIdx]+' '+anioIdx;
  const rowsActual=rowsDelMes(mesIdx,anioIdx);
  const{m:mp,a:ap}=getMesAnterior();
  const rowsAnterior=rowsDelMes(mp,ap);
  const curr=calcStats(rowsActual);
  const prev=calcStats(rowsAnterior);

  document.getElementById('s-pedidos').textContent=curr.pedidos;
  document.getElementById('s-unidades').textContent=curr.unidades.toLocaleString();
  document.getElementById('s-monto').textContent='S/ '+curr.monto.toLocaleString('es-PE',{minimumFractionDigits:2});
  document.getElementById('s-clientes').textContent=curr.clientes;

  ['pedidos','unidades','monto','clientes'].forEach(k=>{
    const c=cmpArrow(curr[k],prev[k]);
    const el=document.getElementById('s-'+k+'-cmp');
    el.textContent=c.txt;el.className='stat-sub '+c.cls;
  });

  renderChartMeses();
  renderChartMonto();
  renderChartEstados(rowsActual);
  renderTopProductos(rowsActual);
  renderTopClientes(rowsActual);
}

function getUltimos6Meses(){
  const result=[];
  for(let i=5;i>=0;i--){
    let m=mesIdx-i,a=anioIdx;
    if(m<0){m+=12;a--;}
    result.push({m,a,label:MESES_ES[m].slice(0,3)});
  }
  return result;
}

function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

function renderChartMeses(){
  destroyChart('meses');
  const meses=getUltimos6Meses();
  const labels=meses.map(x=>x.label);
  const vals=meses.map(x=>rowsDelMes(x.m,x.a).reduce((s,r)=>s+r.cantidad,0));
  charts['meses']=new Chart(document.getElementById('chart-meses'),{
    type:'bar',
    data:{labels,datasets:[{
      label:'Unidades',data:vals,
      backgroundColor:meses.map((_,i)=>i===5?'rgba(124,111,239,0.8)':'rgba(124,111,239,0.3)'),
      borderRadius:6,borderSkipped:false
    }]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#7a7a8a'}},
              y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#7a7a8a'}}}}
  });
}

function renderChartMonto(){
  destroyChart('monto');
  const meses=getUltimos6Meses();
  const labels=meses.map(x=>x.label);
  const vals=meses.map(x=>rowsDelMes(x.m,x.a).reduce((s,r)=>s+r.montoTotal,0));
  charts['monto']=new Chart(document.getElementById('chart-monto'),{
    type:'line',
    data:{labels,datasets:[{
      label:'S/',data:vals,
      borderColor:'#3ecf8e',backgroundColor:'rgba(62,207,142,0.1)',
      pointBackgroundColor:'#3ecf8e',tension:0.4,fill:true,pointRadius:4
    }]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#7a7a8a'}},
              y:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#7a7a8a',callback:v=>'S/'+v.toLocaleString()}}}}
  });
}

function renderChartEstados(rows){
  destroyChart('estados');
  const map={};
  rows.forEach(r=>{const e=(r.estado||'Sin estado').toString().trim();map[e]=(map[e]||0)+1;});
  const labels=Object.keys(map);
  const vals=Object.values(map);
  const colors=['#7c6fef','#3ecf8e','#f5a623','#4ca3e8','#e8524a','#2dd4bf'];
  charts['estados']=new Chart(document.getElementById('chart-estados'),{
    type:'doughnut',
    data:{labels,datasets:[{data:vals,backgroundColor:colors.slice(0,labels.length),borderWidth:0,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'right',labels:{color:'#7a7a8a',font:{size:11},boxWidth:12,padding:12}}}}
  });
}

function renderTopProductos(rows){
  const map={};
  rows.forEach(r=>{map[r.producto]=(map[r.producto]||0)+r.cantidad;});
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=sorted[0]?sorted[0][1]:1;
  document.getElementById('top-productos').innerHTML=sorted.map(([name,val],i)=>`
    <div class="rank-item">
      <span class="rank-num">${i+1}</span>
      <div class="rank-bar-wrap">
        <div class="rank-name" title="${name}">${name}</div>
        <div class="rank-track"><div class="rank-fill" style="width:${Math.round((val/max)*100)}%;background:#7c6fef"></div></div>
      </div>
      <span class="rank-val">${val.toLocaleString()} und</span>
    </div>`).join('');
}

function renderTopClientes(rows){
  const map={};
  rows.forEach(r=>{map[r.cliente]=(map[r.cliente]||0)+r.cantidad;});
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=sorted[0]?sorted[0][1]:1;
  document.getElementById('top-clientes').innerHTML=sorted.map(([name,val],i)=>`
    <div class="rank-item">
      <span class="rank-num">${i+1}</span>
      <div class="rank-bar-wrap">
        <div class="rank-name">${name}</div>
        <div class="rank-track"><div class="rank-fill" style="width:${Math.round((val/max)*100)}%;background:#3ecf8e"></div></div>
      </div>
      <span class="rank-val">${val.toLocaleString()} und</span>
    </div>`).join('');
}

function cambiarMes(dir){
  mesIdx+=dir;
  if(mesIdx>11){mesIdx=0;anioIdx++;}
  if(mesIdx<0){mesIdx=11;anioIdx--;}
  renderDashboard();
}

Chart.defaults.color='#7a7a8a';
Chart.defaults.borderColor='rgba(255,255,255,0.05)';

// Auto-refresh: refresca analytics cada 60s y al volver a la pestaña.
let _autoRefreshTimer = null;
function startAutoRefresh(){
  if(_autoRefreshTimer) return;
  _autoRefreshTimer = setInterval(()=>{ if(!document.hidden && isLoggedIn()) cargarDatos(); }, 60000);
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && isLoggedIn()) cargarDatos();
});
const _origCargarDatos = cargarDatos;
cargarDatos = async function(){ await _origCargarDatos.apply(this, arguments); startAutoRefresh(); };
</script>
</body>
</html>
