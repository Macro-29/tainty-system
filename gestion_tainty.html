<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Insumos · Tainty</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/common.css">
<style>
.topbar-right{display:flex;align-items:center;gap:8px}
.refresh-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid rgba(62,207,142,.3);background:var(--green-dim);color:var(--green);cursor:pointer}
.main{padding:1.5rem;position:relative;z-index:1}
.filters{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.ftab{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.ftab.active{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;margin-bottom:1rem}
.search-input:focus{border-color:var(--purple)}
.ticket{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.ticket-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ticket-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--hint)}
.ticket-prod{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.ticket-meta{font-size:12px;color:var(--muted)}
.ticket-estado{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid transparent}
.estado-recibido{background:var(--surface2);color:var(--muted);border-color:var(--border2)}
.estado-compras{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.2)}
.estado-produccion{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.2)}
.estado-camino{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.2)}
.estado-listo{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.2)}
.estado-cancelado{background:var(--red-dim);color:var(--red);border-color:rgba(232,82,74,.2)}
.insumos-grid{display:grid;gap:0}
.insumo-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.insumo-row:last-child{border:none}
.insumo-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);min-width:80px}
.insumo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .2s}
.dot-pendiente{background:var(--hint)}
.dot-compra{background:var(--amber)}
.dot-produccion{background:var(--purple)}
.dot-camino{background:var(--blue)}
.dot-oficina{background:var(--green)}
.dot-noaplica{background:var(--hint);opacity:.3}
.estado-btns{display:flex;gap:5px;flex-wrap:wrap}
.est-btn{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.est-btn:hover{border-color:var(--border2);color:var(--text)}
.est-btn.sel-pendiente{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.est-btn.sel-compra{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.3)}
.est-btn.sel-produccion{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}
.est-btn.sel-camino{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.3)}
.est-btn.sel-oficina{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.3)}
.est-btn.sel-encurso{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}
.est-btn.sel-finalizado{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.3)}
.est-btn.sel-noaplica{background:transparent;color:var(--hint);border-color:var(--hint);text-decoration:line-through}
.saving-indicator{font-size:11px;color:var(--muted);padding:2px 8px}
.seccion-insumo{margin-bottom:2rem}
.seccion-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border2);border-radius:14px 14px 0 0;border-bottom:none;position:sticky;top:0;z-index:5}
.seccion-titulo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:1px}
.seccion-icono{font-size:18px}
.seccion-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border2);padding:3px 10px;border-radius:20px}
.seccion-stats{display:flex;gap:6px;flex-wrap:wrap}
.stat-pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:12px;border:1px solid var(--border2);color:var(--muted);background:var(--surface)}
.stat-pill.has-count{color:var(--text)}
.stat-pill.s-pendiente.has-count{border-color:rgba(255,255,255,.15)}
.stat-pill.s-compra.has-count{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.3)}
.stat-pill.s-produccion.has-count{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}
.stat-pill.s-camino.has-count{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.3)}
.stat-pill.s-oficina.has-count{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.3)}
.seccion-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;overflow:hidden}
.fila-pedido{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border)}
.fila-pedido:last-child{border:none}
.fila-pedido:hover{background:var(--surface2)}
.fila-info{display:flex;align-items:center;gap:10px;min-width:0}
.fila-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--hint);white-space:nowrap}
.fila-cliente{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.fila-prod{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.fila-cant{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.fila-estado-actual{display:flex;align-items:center;gap:6px;margin-right:8px}
.seccion-empty{padding:1.5rem;text-align:center;color:var(--hint);font-size:13px}
.empty{text-align:center;padding:3rem;color:var(--hint)}
.spinner{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:2rem auto;display:block}
}
@media(max-width:640px){
  .insumo-row{flex-direction:column;align-items:flex-start;gap:6px}
  .estado-btns{flex-wrap:wrap;gap:4px}
  .est-btn{font-size:10px;padding:3px 7px}
  .ticket-header{flex-direction:column;align-items:flex-start}
  .fila-pedido{grid-template-columns:1fr;gap:8px;padding:12px 14px}
  .fila-info{flex-wrap:wrap;gap:6px}
  .fila-cliente,.fila-prod{max-width:100%}
  .seccion-header{padding:12px 14px;flex-wrap:wrap}
  .seccion-titulo{font-size:13px}
.topbar{padding:.75rem 1rem}.main{padding:1rem}.estado-btns{gap:4px}.est-btn{font-size:10px;padding:3px 8px}}
</style>
<script src="./assets/config.js"></script>
<script src="./assets/common.js"></script>
</head>
<body>

<div class="pin-overlay" id="pin-overlay">
  <div class="pin-card">
    <div class="pin-logo">Tainty <span>Labs</span></div>
    <div class="pin-sub">Gestión de insumos</div>
    <div class="pin-dots" id="pin-dots-wrap"></div>
    <div class="pin-grid">
      <button class="pin-key" onclick="pp('1')">1</button><button class="pin-key" onclick="pp('2')">2</button><button class="pin-key" onclick="pp('3')">3</button>
      <button class="pin-key" onclick="pp('4')">4</button><button class="pin-key" onclick="pp('5')">5</button><button class="pin-key" onclick="pp('6')">6</button>
      <button class="pin-key" onclick="pp('7')">7</button><button class="pin-key" onclick="pp('8')">8</button><button class="pin-key" onclick="pp('9')">9</button>
      <button class="pin-clear" onclick="pc()">&#9003;</button><button class="pin-key" onclick="pp('0')">0</button><div></div>
    </div>
    <div class="pin-err" id="pin-err"></div>
  </div>
</div>

<div class="topbar">
  <div class="logo">Tainty <span>Labs</span> &middot; Gestión</div>
  <div class="topbar-right">
    <button class="refresh-btn" onclick="cargarDatos()">&#8635; Actualizar</button>
    <a class="back-btn" href="./index.html">&#8592; Inicio</a>
    <button class="lock-btn" onclick="bloquear()">&#128274; Salir</button>
  </div>
</div>

<div class="main">
  <input class="search-input" id="search" placeholder="Buscar pedido, producto o cliente..." oninput="renderLista()">
  <div class="filters" id="filtros">
    <button class="ftab active" onclick="setFiltro('todos',this)">Todos</button>
    <button class="ftab" onclick="setFiltro('recibido',this)">⏳ Pendientes</button>
    <button class="ftab" onclick="setFiltro('compras',this)">🛒 En compra</button>
    <button class="ftab" onclick="setFiltro('produccion',this)">⚙️ En producción</button>
    <button class="ftab" onclick="setFiltro('camino',this)">🚚 En camino</button>
    <button class="ftab" onclick="setFiltro('listo',this)">📦 En oficina</button>
  </div>
  <div id="lista-pedidos"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PIN='200720';
const PIN_LEN=6;
const ESTADOS=['pendiente','compra','produccion','camino','oficina','noaplica'];
const ESTADOS_MAQUINA=['pendiente','encurso','finalizado'];
const LABELS={'pendiente':'⏳ Pendiente','compra':'🛒 En compra','produccion':'⚙️ En producción','camino':'🚚 En camino','oficina':'📦 En oficina','noaplica':'✕ No aplica','encurso':'⚙️ En curso','finalizado':'✅ Finalizado'};
const DOT={'pendiente':'dot-pendiente','compra':'dot-compra','produccion':'dot-produccion','camino':'dot-camino','oficina':'dot-oficina','noaplica':'dot-noaplica','encurso':'dot-produccion','finalizado':'dot-oficina'};
let pinBuf='',pedidos=[],estadosInsumos={},filtroActual='todos';

function initDots(){
  const w=document.getElementById('pin-dots-wrap');
  w.innerHTML=Array.from({length:PIN_LEN},(_,i)=>`<div class="pin-dot" id="pd${i}"></div>`).join('');
}
function pp(d){
  if(pinBuf.length>=PIN_LEN)return;
  pinBuf+=d;updDots();
  if(pinBuf.length===PIN_LEN){
    setTimeout(()=>{
      if(pinBuf===PIN){document.getElementById('pin-overlay').classList.add('hidden');cargarDatos();}
      else{
        for(let i=0;i<PIN_LEN;i++)document.getElementById('pd'+i).classList.add('error');
        document.getElementById('pin-err').textContent='PIN incorrecto';
        setTimeout(()=>{pinBuf='';updDots();for(let i=0;i<PIN_LEN;i++)document.getElementById('pd'+i).classList.remove('error');document.getElementById('pin-err').textContent='';},800);
      }
    },100);
  }
}
function pc(){pinBuf=pinBuf.slice(0,-1);updDots();}
function updDots(){for(let i=0;i<PIN_LEN;i++){const d=document.getElementById('pd'+i);if(d)d.classList.toggle('filled',i<pinBuf.length);}}
function bloquear(){pinBuf='';initDots();document.getElementById('pin-overlay').classList.remove('hidden');}

async function cargarDatos(){
  document.getElementById('lista-pedidos').innerHTML='<div class="spinner"></div>';
  try{
    const [dp,de]=await Promise.all([
      jsonp(`${SCRIPT_URL}?action=panel&t=${Date.now()}`),
      jsonp(`${SCRIPT_URL}?action=estados&t=${Date.now()}`)
    ]);
    if(dp.success&&dp.pedidos){
      pedidos=dp.pedidos.filter(p=>{
        const e=(p.estado||'').toLowerCase();
        return!e.includes('entregado')&&!e.includes('cancelado');
      }).sort((a,b)=>{
        const na=parseInt((a.numPedido||'P0').replace('P',''))||0;
        const nb=parseInt((b.numPedido||'P0').replace('P',''))||0;
        return nb-na;
      });
    }
    if(de.success&&de.estados)estadosInsumos=de.estados;
    renderLista();
  }catch(e){
    document.getElementById('lista-pedidos').innerHTML='<div class="empty">Error al conectar. <button onclick="cargarDatos()" style="color:var(--purple);background:none;border:none;cursor:pointer">Reintentar</button></div>';
  }
}

function getTipo(n){
  n=(n||'').toLowerCase();
  if(/\(.*cap\)/.test(n))return'cap';
  if(/\(.*gr\)/.test(n))return'gr';
  return'ml';
}
function getInsumos(t){
  return t==='cap'?['Insumo','Capsula','Envase','Etiqueta','Caja','Maquina']:['Insumo','Envase','Etiqueta','Caja','Maquina'];
}
function getEstadoInsumo(pid,ins){return estadosInsumos[pid+'|'+ins]||'pendiente';}

function calcEstadoAuto(pid,tipo){
  const insumos=getInsumos(tipo);
  const clave=insumos.filter(i=>i==='Insumo'||i==='Capsula'||i==='Envase');
  const estados=clave.map(i=>getEstadoInsumo(pid,i));
  // "Listo" requiere que todos los insumos físicos aplicables estén en oficina Y la máquina finalizada
  const fisicos=insumos.filter(i=>i!=='Maquina'&&getEstadoInsumo(pid,i)!=='noaplica');
  const todosFisicosOK=fisicos.every(i=>getEstadoInsumo(pid,i)==='oficina');
  const maquinaOK=getEstadoInsumo(pid,'Maquina')==='finalizado';
  if(todosFisicosOK&&maquinaOK)return'listo';
  if(estados.some(s=>s==='camino'))return'camino';
  if(estados.some(s=>s==='produccion')||getEstadoInsumo(pid,'Maquina')==='encurso')return'produccion';
  if(estados.some(s=>s==='compra'))return'compras';
  return'recibido';
}

function getEstadoInfo(key){
  const map={
    'recibido':{cls:'estado-recibido',label:'📬 Recibido'},
    'compras':{cls:'estado-compras',label:'🛒 Compras'},
    'produccion':{cls:'estado-produccion',label:'⚙️ En producción'},
    'camino':{cls:'estado-camino',label:'🚚 En camino'},
    'listo':{cls:'estado-listo',label:'📦 Listo para envío'},
    'cancelado':{cls:'estado-cancelado',label:'❌ Cancelado'},
  };
  return map[key]||map['recibido'];
}

function calcProgreso(pid,tipo){
  const ins=getInsumos(tipo);
  const aplic=ins.filter(i=>getEstadoInsumo(pid,i)!=='noaplica');
  if(!aplic.length)return 100;
  const completados=aplic.filter(i=>{
    const e=getEstadoInsumo(pid,i);
    return i==='Maquina'?e==='finalizado':e==='oficina';
  }).length;
  return Math.round(completados/aplic.length*100);
}

const ICONO_INSUMO={'Insumo':'🧪','Capsula':'💊','Envase':'🫙','Etiqueta':'🏷️','Caja':'📦','Maquina':'🏭'};
const ORDEN_INSUMOS=['Insumo','Capsula','Envase','Etiqueta','Caja','Maquina'];

// Mapea el filtro superior al estado equivalente para insumos físicos y para máquina
const FILTRO_A_ESTADO={'recibido':'pendiente','compras':'compra','produccion':'produccion','camino':'camino','listo':'oficina'};
const FILTRO_A_ESTADO_MAQ={'recibido':'pendiente','compras':null,'produccion':'encurso','camino':null,'listo':'finalizado'};

function renderLista(){
  const q=(document.getElementById('search').value||'').toLowerCase();

  // Filtrado por búsqueda (no por estado, eso se hace por sección)
  const lista=pedidos.filter(p=>{
    if(!q)return true;
    return(p.numPedido||'').toLowerCase().includes(q)
      ||(p.cliente||'').toLowerCase().includes(q)
      ||(p.producto||'').toLowerCase().includes(q);
  }).sort((a,b)=>{
    const na=parseInt((a.numPedido||'P0').replace('P',''))||0;
    const nb=parseInt((b.numPedido||'P0').replace('P',''))||0;
    return na-nb;
  });

  if(!lista.length){
    document.getElementById('lista-pedidos').innerHTML='<div class="empty">No hay pedidos que coincidan con la búsqueda</div>';
    return;
  }

  // Construir cada sección de insumo
  const seccionesHtml=ORDEN_INSUMOS.map(insumo=>{
    const esMaquina=insumo==='Maquina';
    const estadosSeccion=esMaquina?ESTADOS_MAQUINA:ESTADOS;
    const estadoFiltro=esMaquina?FILTRO_A_ESTADO_MAQ[filtroActual]:FILTRO_A_ESTADO[filtroActual];
    const filtroAplicable=filtroActual==='todos'?null:estadoFiltro;

    // Pedidos que aplican a este insumo (las cápsulas solo aplican a tipo 'cap')
    const pedidosSeccion=lista.filter(p=>{
      const insumosDelPedido=getInsumos(getTipo(p.producto));
      return insumosDelPedido.includes(insumo);
    });

    if(!pedidosSeccion.length)return'';

    // Conteo de estados para los pills de la cabecera
    const conteo=esMaquina
      ?{pendiente:0,encurso:0,finalizado:0}
      :{pendiente:0,compra:0,produccion:0,camino:0,oficina:0};
    pedidosSeccion.forEach(p=>{
      const e=getEstadoInsumo(p.numPedido,insumo);
      if(e in conteo)conteo[e]++;
    });

    // Aplicar filtro de estado si corresponde
    let pedidosFiltrados=pedidosSeccion;
    if(filtroActual!=='todos'){
      if(filtroAplicable===null){
        // Este filtro no aplica a esta sección (ej. "Compras" no aplica a Máquina)
        pedidosFiltrados=[];
      }else{
        pedidosFiltrados=pedidosSeccion.filter(p=>getEstadoInsumo(p.numPedido,insumo)===filtroAplicable);
      }
    }

    // Render de las filas
    let bodyHtml;
    if(!pedidosFiltrados.length){
      bodyHtml='<div class="seccion-empty">Sin pedidos en este estado</div>';
    }else{
      bodyHtml=pedidosFiltrados.map(p=>{
        const est=getEstadoInsumo(p.numPedido,insumo);
        const btns=estadosSeccion.map(s=>{
          const isSel=est===s;
          return`<button class="est-btn${isSel?' sel-'+s:''}" onclick="cambiarEstado('${p.numPedido}','${insumo}','${s}')">${LABELS[s]}</button>`;
        }).join('');
        return`<div class="fila-pedido">
          <div class="fila-info">
            <span class="fila-num">${p.numPedido||''}</span>
            <span class="fila-prod">${p.producto||''}</span>
            <span class="fila-cant">${parseInt(p.cantidad||0).toLocaleString()} und</span>
          </div>
          <div class="fila-estado-actual">
            <span class="insumo-dot ${DOT[est]||'dot-pendiente'}"></span>
            <div class="estado-btns">${btns}</div>
            <span class="saving-indicator" id="si-${p.numPedido}-${insumo}"></span>
          </div>
        </div>`;
      }).join('');
    }

    // Pills de estado en la cabecera
    const pillsConfig=esMaquina?[
      ['pendiente','⏳',conteo.pendiente],
      ['produccion','⚙️',conteo.encurso],
      ['oficina','✅',conteo.finalizado],
    ]:[
      ['pendiente','⏳',conteo.pendiente],
      ['compra','🛒',conteo.compra],
      ['produccion','⚙️',conteo.produccion],
      ['camino','🚚',conteo.camino],
      ['oficina','📦',conteo.oficina],
    ];
    const pillsHtml=pillsConfig.map(([k,ic,n])=>`<span class="stat-pill s-${k}${n>0?' has-count':''}">${ic} ${n}</span>`).join('');

    return`<div class="seccion-insumo">
      <div class="seccion-header">
        <div class="seccion-titulo">
          <span class="seccion-icono">${ICONO_INSUMO[insumo]||''}</span>
          ${insumo}
          <span class="seccion-count">${pedidosFiltrados.length}/${pedidosSeccion.length}</span>
        </div>
        <div class="seccion-stats">${pillsHtml}</div>
      </div>
      <div class="seccion-body">${bodyHtml}</div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('lista-pedidos').innerHTML=seccionesHtml;
}

async function cambiarEstado(pedidoId,insumo,estado){
  estadosInsumos[pedidoId+'|'+insumo]=estado;
  renderLista();
  const ind=document.getElementById('si-'+pedidoId+'-'+insumo);
  if(ind)ind.textContent='Guardando...';
  try{
    const form=new FormData();
    form.append('action','setEstado');
    form.append('pedido',pedidoId);
    form.append('insumo',insumo);
    form.append('estado',estado);
    await fetch(SCRIPT_URL,{method:'POST',body:form,mode:'no-cors'});
    await new Promise(r=>setTimeout(r,1000));
    if(ind)ind.textContent='✓';
    setTimeout(()=>{if(ind)ind.textContent='';},1500);
  }catch(e){
    if(ind)ind.textContent='Error';
    setTimeout(()=>{if(ind)ind.textContent='';},2000);
  }
}

function setFiltro(f,btn){
  filtroActual=f;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLista();
}

initDots();

// Auto-refresh: una vez desbloqueado, refresca cada 60s mientras la pestaña está
// visible, y también al volver a la pestaña tras estar en background.
let _autoRefreshTimer = null;
function isUnlocked(){
  const ov = document.getElementById('pin-overlay');
  return ov && ov.classList.contains('hidden');
}
function startAutoRefresh(){
  if(_autoRefreshTimer) return;
  _autoRefreshTimer = setInterval(()=>{ if(!document.hidden && isUnlocked()) cargarDatos(); }, 60000);
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && isUnlocked()) cargarDatos();
});
const _origCargarDatos = cargarDatos;
cargarDatos = async function(){ await _origCargarDatos.apply(this, arguments); startAutoRefresh(); };
</script>
