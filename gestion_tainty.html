<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Insumos · Tainty</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/common.css">
<style>
.topbar-right{display:flex;align-items:center;gap:8px}
.refresh-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid rgba(62,207,142,.3);background:var(--green-dim);color:var(--green);cursor:pointer}
.main{padding:1.5rem;position:relative;z-index:1}
.filters{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.ftab{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.ftab.active{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;margin-bottom:1rem}
.search-input:focus{border-color:var(--purple)}
.ticket{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px}
.ticket-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ticket-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--hint)}
.ticket-prod{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.ticket-meta{font-size:12px;color:var(--muted)}
.ticket-estado{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid transparent}
.estado-recibido{background:var(--surface2);color:var(--muted);border-color:var(--border2)}
.estado-compras{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.2)}
.estado-produccion{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.2)}
.estado-camino{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.2)}
.estado-listo{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.2)}
.estado-cancelado{background:var(--red-dim);color:var(--red);border-color:rgba(232,82,74,.2)}
/* ── Stepper / track de fases ─────────────────────────────
   Cada insumo se muestra como pasos conectados. La parte
   completada del track se tiñe con el color del estado actual
   (--acc), el paso actual lleva halo y los futuros van huecos. */
.stepper-wrap{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0}
.stepper{flex:0 1 520px;display:flex;align-items:flex-start;min-width:0}
.step{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.step-node{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);background:var(--surface);position:relative;z-index:2;transition:all .18s}
.step-label{font-size:10px;line-height:1.15;color:var(--hint);white-space:nowrap;transition:color .18s}
.step:not(:first-child)::before{content:'';position:absolute;top:7px;left:-50%;right:50%;height:2px;background:var(--border2);z-index:1;transition:background .18s}
.step:hover .step-node{border-color:var(--text)}
.step:hover .step-label{color:var(--muted)}
.step.done .step-node{background:var(--acc);border-color:var(--acc)}
.step.done::before,.step.current::before{background:var(--acc)}
.step.done .step-label{color:var(--muted)}
.step.current .step-node{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-dim)}
.step.current .step-label{color:var(--acc);font-weight:600}
.step-na{flex-shrink:0;width:26px;height:26px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--hint);cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.step-na:hover{color:var(--text);border-color:var(--border2)}
.step-na.active{color:var(--red);border-color:rgba(232,82,74,.4);background:var(--red-dim)}
.stepper-wrap.is-na .stepper{opacity:.32;filter:grayscale(1)}
.saving-indicator{font-size:11px;color:var(--muted);padding:2px 8px}
.seccion-insumo{margin-bottom:2rem}
.seccion-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border2);border-radius:14px 14px 0 0;border-bottom:none;position:sticky;top:0;z-index:5}
.seccion-titulo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:1px}
.seccion-icono{font-size:18px}
.seccion-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border2);padding:3px 10px;border-radius:20px}
.seccion-stats{display:flex;gap:6px;flex-wrap:wrap}
.stat-pill{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border-radius:12px;border:1px solid var(--border2);color:var(--muted);background:var(--surface)}
.stat-pill.has-count{color:var(--text)}
.stat-pill.s-pendiente.has-count{border-color:rgba(255,255,255,.15)}
.stat-pill.s-compra.has-count{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.3)}
.stat-pill.s-produccion.has-count{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}
.stat-pill.s-camino.has-count{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.3)}
.stat-pill.s-oficina.has-count{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.3)}
.btn-copiar-sec{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid rgba(124,111,239,.3);background:var(--purple-dim);color:var(--purple);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-copiar-sec:hover{background:rgba(124,111,239,.25)}
.btn-copiar-sec:active{transform:scale(.97)}
.seccion-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;overflow:hidden}
.fila-pedido{display:flex;align-items:center;gap:18px;padding:14px 18px;border-bottom:1px solid var(--border)}
.fila-pedido:last-child{border:none}
.fila-pedido:hover{background:var(--surface2)}
.fila-info{display:flex;align-items:center;gap:10px;min-width:0}
.fila-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--hint);white-space:nowrap}
.fila-cliente{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.fila-prod{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.fila-cant{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.fila-info{flex-shrink:0;min-width:0}
.seccion-empty{padding:1.5rem;text-align:center;color:var(--hint);font-size:13px}
.empty{text-align:center;padding:3rem;color:var(--hint)}
.spinner{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;margin:2rem auto;display:block}
@media(max-width:640px){
  .ticket-header{flex-direction:column;align-items:flex-start}
  .fila-pedido{flex-direction:column;align-items:stretch;gap:12px;padding:14px}
  .fila-info{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0!important}
  .fila-cliente,.fila-prod{max-width:100%}
  .stepper-wrap{width:100%;justify-content:flex-start}
  .stepper{flex:1}
  .step-label{font-size:9px}
  .seccion-header{padding:12px 14px;flex-wrap:wrap}
  .seccion-titulo{font-size:13px}
  .topbar{padding:.75rem 1rem}.main{padding:1rem}}
</style>
<script src="./assets/auth.js"></script>
<script src="./assets/config.js"></script>
<script src="./assets/common.js"></script>
</head>
<body>

<div class="topbar">
  <div class="logo">Tainty <span>Labs</span> &middot; Gestión</div>
  <div class="topbar-right">
    <button class="refresh-btn" onclick="cargarDatos()">&#8635; Actualizar</button>
    <a class="back-btn" href="./index.html">&#8592; Inicio</a>
    <button class="lock-btn" onclick="cerrarSesion()">&#128274; Salir</button>
  </div>
</div>

<div class="main">
  <input class="search-input" id="search" placeholder="Buscar pedido, producto o cliente..." oninput="renderLista()">
  <div class="filters" id="modo-orden" style="margin-bottom:.5rem">
    <button class="ftab active" onclick="setModoOrden('insumo',this)" id="modo-insumo">🧪 Por insumo</button>
    <button class="ftab" onclick="setModoOrden('producto',this)" id="modo-producto">📦 Por producto</button>
  </div>
  <div class="filters" id="filtros">
    <button class="ftab active" onclick="setFiltro('todos',this)">Todos</button>
    <button class="ftab" onclick="setFiltro('recibido',this)">⏳ Pendientes</button>
    <button class="ftab" onclick="setFiltro('compras',this)">🛒 En compra</button>
    <button class="ftab" onclick="setFiltro('produccion',this)">⚙️ En producción</button>
    <button class="ftab" onclick="setFiltro('camino',this)">🚚 En camino</button>
    <button class="ftab" onclick="setFiltro('listo',this)">📦 En oficina</button>
  </div>
  <div id="lista-pedidos"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>

// Auth gate: si no hay sesion, requireLogin redirige al index.
if (!requireLogin()) {
  // El navegador ya esta yendo al index; lo siguiente no se ejecuta.
} else {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => cargarDatos());
  } else {
    cargarDatos();
  }
}
const ESTADOS=['pendiente','compra','produccion','camino','oficina','noaplica'];
const ESTADOS_MAQUINA=['pendiente','encurso','finalizado'];
// Etiquetas y cajas no pasan por la fase de compra (vienen del proveedor
// directo a producción), así que ocultamos el botón "En compra" en sus secciones.
const INSUMOS_SIN_COMPRA = new Set(['Etiqueta', 'Caja']);
const ESTADOS_SIN_COMPRA = ESTADOS.filter(s => s !== 'compra');

/** Devuelve los estados disponibles para un insumo según sus particularidades. */
function estadosDeInsumo(insumo) {
  if (insumo === 'Maquina')             return ESTADOS_MAQUINA;
  if (INSUMOS_SIN_COMPRA.has(insumo))   return ESTADOS_SIN_COMPRA;
  return ESTADOS;
}
const LABELS={'pendiente':'⏳ Pendiente','compra':'🛒 En compra','produccion':'⚙️ En producción','camino':'🚚 En camino','oficina':'📦 En oficina','noaplica':'✕ No aplica','encurso':'⚙️ En curso','finalizado':'✅ Finalizado'};
const DOT={'pendiente':'dot-pendiente','compra':'dot-compra','produccion':'dot-produccion','camino':'dot-camino','oficina':'dot-oficina','noaplica':'dot-noaplica','encurso':'dot-produccion','finalizado':'dot-oficina'};
// Emoji compacto usado en el texto exportable (botón Copiar por sección).
const ESTADO_EMOJI={'pendiente':'⏳','compra':'🛒','produccion':'⚙️','camino':'🚚','oficina':'✅','noaplica':'➖','encurso':'⚙️','finalizado':'✅'};
// Etiquetas cortas (sin emoji) para los nodos del stepper.
const STEP_LABEL={'pendiente':'Pendiente','compra':'Compra','produccion':'Producción','camino':'Camino','oficina':'Oficina','encurso':'En curso','finalizado':'Finalizado'};
// Color del track según el estado actual: [--acc, --acc-dim].
const ACC={
  'pendiente':['var(--muted)','rgba(122,122,138,.18)'],
  'compra':['var(--amber)','var(--amber-dim)'],
  'produccion':['var(--purple)','var(--purple-dim)'],
  'camino':['var(--blue)','var(--blue-dim)'],
  'oficina':['var(--green)','var(--green-dim)'],
  'encurso':['var(--purple)','var(--purple-dim)'],
  'finalizado':['var(--green)','var(--green-dim)'],
  'noaplica':['var(--hint)','transparent'],
};

/**
 * Renderiza el stepper de un insumo: pasos conectados con el track
 * coloreado hasta el estado actual, más el toggle "✕ No aplica"
 * (oculto en Máquina, que no admite ese estado).
 */
function renderStepper(pid,insumo){
  const all=estadosDeInsumo(insumo);
  const hasNa=all.includes('noaplica');
  const linear=all.filter(s=>s!=='noaplica');
  const cur=getEstadoInsumo(pid,insumo);
  const na=cur==='noaplica';
  const curIdx=na?-1:linear.indexOf(cur);
  const [acc,accDim]=ACC[na?'noaplica':cur]||ACC['pendiente'];
  const steps=linear.map((s,i)=>{
    let cls='step';
    if(!na){
      if(i<curIdx)cls+=' done';
      else if(i===curIdx)cls+=' current';
    }
    return`<button class="${cls}" onclick="cambiarEstado('${pid}','${insumo}','${s}')" title="${LABELS[s]}">
      <span class="step-node"></span>
      <span class="step-label">${STEP_LABEL[s]||s}</span>
    </button>`;
  }).join('');
  const naBtn=hasNa
    ?`<button class="step-na${na?' active':''}" onclick="cambiarEstado('${pid}','${insumo}','noaplica')" title="No aplica">✕</button>`
    :'';
  return`<div class="stepper-wrap${na?' is-na':''}">
    <div class="stepper" style="--acc:${acc};--acc-dim:${accDim}">${steps}</div>
    ${naBtn}
    <span class="saving-indicator" id="si-${pid}-${insumo}"></span>
  </div>`;
}
let pedidos=[],estadosInsumos={},filtroActual='todos',modoOrden='insumo';

function initDots(){
  const w=document.getElementById('pin-dots-wrap');
  w.innerHTML=Array.from({length:PIN_LEN},(_,i)=>`<div class="pin-dot" id="pd${i}"></div>`).join('');
}
async function cargarDatos(){
  document.getElementById('lista-pedidos').innerHTML='<div class="spinner"></div>';
  try{
    const [dp,de]=await Promise.all([
      jsonp(`${SCRIPT_URL}?action=panel&t=${Date.now()}`),
      jsonp(`${SCRIPT_URL}?action=estados&t=${Date.now()}`)
    ]);
    if(dp.success&&dp.pedidos){
      pedidos=dp.pedidos.filter(p=>{
        const e=(p.estado||'').toLowerCase();
        return!e.includes('entregado')&&!e.includes('cancelado');
      }).sort((a,b)=>{
        const na=parseInt((a.numPedido||'P0').replace('P',''))||0;
        const nb=parseInt((b.numPedido||'P0').replace('P',''))||0;
        return nb-na;
      });
    }
    if(de.success&&de.estados)estadosInsumos=de.estados;
    renderLista();
  }catch(e){
    document.getElementById('lista-pedidos').innerHTML='<div class="empty">Error al conectar. <button onclick="cargarDatos()" style="color:var(--purple);background:none;border:none;cursor:pointer">Reintentar</button></div>';
  }
}

function getTipo(n){
  n=(n||'').toLowerCase();
  if(/\(.*cap\)/.test(n))return'cap';
  if(/\(.*gr\)/.test(n))return'gr';
  return'ml';
}
function getInsumos(t){
  return t==='cap'?['Insumo','Capsula','Envase','Etiqueta','Caja','Maquina']:['Insumo','Envase','Etiqueta','Caja','Maquina'];
}
function getEstadoInsumo(pid,ins){return estadosInsumos[pid+'|'+ins]||'pendiente';}

function calcEstadoAuto(pid,tipo){
  const insumos=getInsumos(tipo);
  const clave=insumos.filter(i=>i==='Insumo'||i==='Capsula'||i==='Envase');
  const estados=clave.map(i=>getEstadoInsumo(pid,i));
  // "Listo" requiere que todos los insumos físicos aplicables estén en oficina Y la máquina finalizada
  const fisicos=insumos.filter(i=>i!=='Maquina'&&getEstadoInsumo(pid,i)!=='noaplica');
  const todosFisicosOK=fisicos.every(i=>getEstadoInsumo(pid,i)==='oficina');
  const maquinaOK=getEstadoInsumo(pid,'Maquina')==='finalizado';
  if(todosFisicosOK&&maquinaOK)return'listo';
  if(estados.some(s=>s==='camino'))return'camino';
  if(estados.some(s=>s==='produccion')||getEstadoInsumo(pid,'Maquina')==='encurso')return'produccion';
  if(estados.some(s=>s==='compra'))return'compras';
  return'recibido';
}

function getEstadoInfo(key){
  const map={
    'recibido':{cls:'estado-recibido',label:'📬 Recibido'},
    'compras':{cls:'estado-compras',label:'🛒 Compras'},
    'produccion':{cls:'estado-produccion',label:'⚙️ En producción'},
    'camino':{cls:'estado-camino',label:'🚚 En camino'},
    'listo':{cls:'estado-listo',label:'📦 Listo para envío'},
    'cancelado':{cls:'estado-cancelado',label:'❌ Cancelado'},
  };
  return map[key]||map['recibido'];
}

function calcProgreso(pid,tipo){
  const ins=getInsumos(tipo);
  const aplic=ins.filter(i=>getEstadoInsumo(pid,i)!=='noaplica');
  if(!aplic.length)return 100;
  const completados=aplic.filter(i=>{
    const e=getEstadoInsumo(pid,i);
    return i==='Maquina'?e==='finalizado':e==='oficina';
  }).length;
  return Math.round(completados/aplic.length*100);
}

const ICONO_INSUMO={'Insumo':'🧪','Capsula':'💊','Envase':'🫙','Etiqueta':'🏷️','Caja':'📦','Maquina':'🏭'};
const ORDEN_INSUMOS=['Insumo','Capsula','Envase','Etiqueta','Caja','Maquina'];

// Mapea el filtro superior al estado equivalente para insumos físicos y para máquina
const FILTRO_A_ESTADO={'recibido':'pendiente','compras':'compra','produccion':'produccion','camino':'camino','listo':'oficina'};
const FILTRO_A_ESTADO_MAQ={'recibido':'pendiente','compras':null,'produccion':'encurso','camino':null,'listo':'finalizado'};

// Devuelve la lista de pedidos filtrada por la búsqueda activa y ordenada
// por número de pedido. NO aplica filtro por estado (eso se hace por sección
// o por insumo dentro del bloque del producto).
function getListaBase(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  return pedidos.filter(p=>{
    if(!q)return true;
    return(p.numPedido||'').toLowerCase().includes(q)
      ||(p.cliente||'').toLowerCase().includes(q)
      ||(p.producto||'').toLowerCase().includes(q);
  }).sort((a,b)=>{
    const na=parseInt((a.numPedido||'P0').replace('P',''))||0;
    const nb=parseInt((b.numPedido||'P0').replace('P',''))||0;
    return na-nb;
  });
}

function setModoOrden(modo,btn){
  modoOrden=modo;
  document.querySelectorAll('#modo-orden .ftab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderLista();
}

function renderLista(){
  if(modoOrden==='producto')return renderListaPorProducto();
  const lista=getListaBase();

  if(!lista.length){
    document.getElementById('lista-pedidos').innerHTML='<div class="empty">No hay pedidos que coincidan con la búsqueda</div>';
    return;
  }

  // Construir cada sección de insumo
  const seccionesHtml=ORDEN_INSUMOS.map(insumo=>{
    const esMaquina=insumo==='Maquina';
    const estadoFiltro=esMaquina?FILTRO_A_ESTADO_MAQ[filtroActual]:FILTRO_A_ESTADO[filtroActual];
    const filtroAplicable=filtroActual==='todos'?null:estadoFiltro;

    // Pedidos que aplican a este insumo (las cápsulas solo aplican a tipo 'cap')
    const pedidosSeccion=lista.filter(p=>{
      const insumosDelPedido=getInsumos(getTipo(p.producto));
      return insumosDelPedido.includes(insumo);
    });

    if(!pedidosSeccion.length)return'';

    // Conteo de estados para los pills de la cabecera
    const conteo=esMaquina
      ?{pendiente:0,encurso:0,finalizado:0}
      :{pendiente:0,compra:0,produccion:0,camino:0,oficina:0};
    pedidosSeccion.forEach(p=>{
      const e=getEstadoInsumo(p.numPedido,insumo);
      if(e in conteo)conteo[e]++;
    });

    // Aplicar filtro de estado si corresponde
    let pedidosFiltrados=pedidosSeccion;
    if(filtroActual!=='todos'){
      if(filtroAplicable===null){
        // Este filtro no aplica a esta sección (ej. "Compras" no aplica a Máquina)
        pedidosFiltrados=[];
      }else{
        pedidosFiltrados=pedidosSeccion.filter(p=>getEstadoInsumo(p.numPedido,insumo)===filtroAplicable);
      }
    }

    // Render de las filas
    let bodyHtml;
    if(!pedidosFiltrados.length){
      bodyHtml='<div class="seccion-empty">Sin pedidos en este estado</div>';
    }else{
      bodyHtml=pedidosFiltrados.map(p=>{
        return`<div class="fila-pedido">
          <div class="fila-info">
            <span class="fila-num">${p.numPedido||''}</span>
            <span class="fila-prod">${p.producto||''}</span>
            <span class="fila-cant">${parseInt(p.cantidad||0).toLocaleString()} und</span>
          </div>
          ${renderStepper(p.numPedido,insumo)}
        </div>`;
      }).join('');
    }

    // Pills de estado en la cabecera. Etiqueta y Caja omiten el pill de
    // compra porque ese estado no aplica a esos insumos.
    const pillsConfig = esMaquina
      ? [
          ['pendiente','⏳',conteo.pendiente],
          ['produccion','⚙️',conteo.encurso],
          ['oficina','✅',conteo.finalizado],
        ]
      : INSUMOS_SIN_COMPRA.has(insumo)
      ? [
          ['pendiente','⏳',conteo.pendiente],
          ['produccion','⚙️',conteo.produccion],
          ['camino','🚚',conteo.camino],
          ['oficina','📦',conteo.oficina],
        ]
      : [
          ['pendiente','⏳',conteo.pendiente],
          ['compra','🛒',conteo.compra],
          ['produccion','⚙️',conteo.produccion],
          ['camino','🚚',conteo.camino],
          ['oficina','📦',conteo.oficina],
        ];
    const pillsHtml=pillsConfig.map(([k,ic,n])=>`<span class="stat-pill s-${k}${n>0?' has-count':''}">${ic} ${n}</span>`).join('');

    return`<div class="seccion-insumo">
      <div class="seccion-header">
        <div class="seccion-titulo">
          <span class="seccion-icono">${ICONO_INSUMO[insumo]||''}</span>
          ${insumo}
          <span class="seccion-count">${pedidosFiltrados.length}/${pedidosSeccion.length}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div class="seccion-stats">${pillsHtml}</div>
          <button class="btn-copiar-sec" onclick="copiarSeccion('${insumo}')" title="Copiar al portapapeles">📋 Copiar</button>
        </div>
      </div>
      <div class="seccion-body">${bodyHtml}</div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('lista-pedidos').innerHTML=seccionesHtml;
}

/**
 * Genera el texto exportable de una sección de insumo y lo copia al portapapeles.
 * Respeta la búsqueda actual y el filtro de estado activo (igual que la UI).
 * Formato:
 *   <INSUMO>
 *   (línea en blanco)
 *   <emoji-estado><PRODUCTO>\t<CANTIDAD>
 *   ...
 */
function copiarSeccion(insumo){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const lista=pedidos.filter(p=>{
    if(!q)return true;
    return(p.numPedido||'').toLowerCase().includes(q)
      ||(p.cliente||'').toLowerCase().includes(q)
      ||(p.producto||'').toLowerCase().includes(q);
  }).sort((a,b)=>{
    const na=parseInt((a.numPedido||'P0').replace('P',''))||0;
    const nb=parseInt((b.numPedido||'P0').replace('P',''))||0;
    return na-nb;
  });

  let pedidosSeccion=lista.filter(p=>getInsumos(getTipo(p.producto)).includes(insumo));

  // Si hay filtro de estado activo, aplicar igual que en la UI
  const esMaquina=insumo==='Maquina';
  const estadoFiltro=esMaquina?FILTRO_A_ESTADO_MAQ[filtroActual]:FILTRO_A_ESTADO[filtroActual];
  if(filtroActual!=='todos'&&estadoFiltro){
    pedidosSeccion=pedidosSeccion.filter(p=>getEstadoInsumo(p.numPedido,insumo)===estadoFiltro);
  }

  // Excluir lo que ya está finalizado para esta sección — solo nos importa lo
  // pendiente / en curso. Para insumos físicos: estados 'oficina' (ya llegó)
  // y 'noaplica' (no se necesita). Para Maquina: 'finalizado' y 'noaplica'.
  const ESTADOS_EXCLUIR = esMaquina
    ? new Set(['finalizado','noaplica'])
    : new Set(['oficina','noaplica']);
  pedidosSeccion = pedidosSeccion.filter(p =>
    !ESTADOS_EXCLUIR.has(getEstadoInsumo(p.numPedido, insumo))
  );

  if(!pedidosSeccion.length){
    mostrarToast('No hay pedidos pendientes para copiar en esta sección',{type:'error',duration:2500});
    return;
  }

  const texto=pedidosSeccion.map(p=>{
    const est=getEstadoInsumo(p.numPedido,insumo);
    const emoji=ESTADO_EMOJI[est]||'';
    const cant=parseInt(p.cantidad||0);
    return`${emoji}${p.producto||''}\t${cant}`;
  }).join('\n');

  navigator.clipboard.writeText(texto).then(()=>{
    mostrarToast(`✓ ${insumo} copiado (${pedidosSeccion.length} pedido${pedidosSeccion.length===1?'':'s'})`,{type:'success',duration:2500});
  }).catch(()=>{
    mostrarToast('No se pudo copiar al portapapeles',{type:'error',duration:3500});
  });
}

/* =========================================================
   Modo "Por producto"
   Cada card es un pedido (producto + cliente + cantidad),
   y dentro muestra el estado de cada insumo aplicable.
   ========================================================= */

const ORDEN_INSUMOS_LABELS = {
  'Insumo':'Insumo', 'Capsula':'Cápsula', 'Envase':'Envase',
  'Etiqueta':'Etiqueta', 'Caja':'Caja', 'Maquina':'Máquina'
};

// Texto descriptivo de cada estado (sin emoji), para usar en exports.
const ESTADO_TEXTO = {
  'pendiente':'Pendiente',
  'compra':'En compra',
  'produccion':'En producción',
  'camino':'En camino',
  'oficina':'En oficina',
  'noaplica':'No aplica',
  'encurso':'En curso',
  'finalizado':'Finalizado'
};

function renderListaPorProducto(){
  const lista=getListaBase();
  if(!lista.length){
    document.getElementById('lista-pedidos').innerHTML='<div class="empty">No hay pedidos que coincidan con la búsqueda</div>';
    return;
  }

  // Aplicar filtro de estado a nivel pedido: el pedido aparece si AL MENOS UNO
  // de sus insumos tiene el estado del filtro.
  const filtroAplicaInsumo=FILTRO_A_ESTADO[filtroActual];
  const filtroAplicaMaq=FILTRO_A_ESTADO_MAQ[filtroActual];
  const listaFiltrada=filtroActual==='todos'?lista:lista.filter(p=>{
    const insumosP=getInsumos(getTipo(p.producto));
    return insumosP.some(insumo=>{
      const esMaq=insumo==='Maquina';
      const objetivo=esMaq?filtroAplicaMaq:filtroAplicaInsumo;
      if(!objetivo)return false;
      return getEstadoInsumo(p.numPedido,insumo)===objetivo;
    });
  });

  if(!listaFiltrada.length){
    document.getElementById('lista-pedidos').innerHTML='<div class="empty">Sin pedidos en este estado</div>';
    return;
  }

  document.getElementById('lista-pedidos').innerHTML=listaFiltrada.map(p=>{
    const insumosP=getInsumos(getTipo(p.producto));
    const cant=parseInt(p.cantidad||0);
    const filas=insumosP.map(insumo=>{
      return`<div class="fila-pedido">
        <div class="fila-info" style="min-width:120px;flex-shrink:0">
          <span class="seccion-icono" style="margin-right:4px">${ICONO_INSUMO[insumo]||''}</span>
          <span style="font-size:13px;color:var(--text)">${ORDEN_INSUMOS_LABELS[insumo]||insumo}</span>
        </div>
        ${renderStepper(p.numPedido,insumo)}
      </div>`;
    }).join('');

    return`<div class="seccion-insumo">
      <div class="seccion-header">
        <div class="seccion-titulo" style="flex-direction:column;align-items:flex-start;gap:2px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="ticket-num" style="font-family:DM Mono,monospace;font-size:11px;color:var(--hint)">${p.numPedido||''}</span>
            <span style="font-family:Syne,sans-serif;font-size:14px;font-weight:700;color:var(--text);text-transform:none;letter-spacing:normal">${p.producto||''}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);font-family:DM Sans,sans-serif;text-transform:none;letter-spacing:normal">
            ${p.cliente||''} · ${cant.toLocaleString()} und
          </div>
        </div>
        <button class="btn-copiar-sec" onclick="copiarProducto('${p.numPedido}')" title="Copiar estado de este producto">📋 Copiar</button>
      </div>
      <div class="seccion-body">${filas}</div>
    </div>`;
  }).join('');
}

/**
 * Copia al portapapeles el estado de cada insumo de un pedido específico.
 * Formato:
 *   P0123 · PRODUCTO (CAP) · 100 und · CLIENTE
 *   ⏳ Insumo
 *   🛒 Cápsula
 *   ⚙️ Envase
 *   ...
 */
function copiarProducto(numPedido){
  const p=pedidos.find(x=>x.numPedido===numPedido);
  if(!p){mostrarToast('Pedido no encontrado',{type:'error',duration:2500});return;}
  const insumosP=getInsumos(getTipo(p.producto));
  const cant=parseInt(p.cantidad||0).toLocaleString();
  const head=`${p.numPedido||''} · ${p.producto||''} · ${cant} und${p.cliente?' · '+p.cliente:''}`;
  // Excluir los insumos que ya están en oficina / finalizado / noaplica —
  // solo nos interesa exportar lo que todavía requiere acción.
  const ESTADOS_EXCLUIR = new Set(['oficina','finalizado','noaplica']);
  const filas=insumosP
    .filter(insumo => !ESTADOS_EXCLUIR.has(getEstadoInsumo(p.numPedido, insumo)))
    .map(insumo=>{
      const est=getEstadoInsumo(p.numPedido,insumo);
      const emoji=ESTADO_EMOJI[est]||'';
      const texto=ESTADO_TEXTO[est]||est||'';
      const nombre=ORDEN_INSUMOS_LABELS[insumo]||insumo;
      return texto ? `${emoji} ${nombre} (${texto})` : `${emoji} ${nombre}`;
    });
  if(!filas.length){
    mostrarToast('Este pedido ya está completo (todo en oficina o no aplica)',{type:'success',duration:3000});
    return;
  }
  const texto=[head,...filas].join('\n');
  navigator.clipboard.writeText(texto).then(()=>{
    mostrarToast('✓ Estado de '+p.numPedido+' copiado',{type:'success',duration:2500});
  }).catch(()=>{
    mostrarToast('No se pudo copiar al portapapeles',{type:'error',duration:3500});
  });
}

async function cambiarEstado(pedidoId,insumo,estado){
  estadosInsumos[pedidoId+'|'+insumo]=estado;
  renderLista();
  const ind=document.getElementById('si-'+pedidoId+'-'+insumo);
  if(ind)ind.textContent='Guardando...';
  try{
    const form=new FormData();
    form.append('action','setEstado');
    form.append('pedido',pedidoId);
    form.append('insumo',insumo);
    form.append('estado',estado);
    await fetch(SCRIPT_URL,{method:'POST',body:form,mode:'no-cors'});
    await new Promise(r=>setTimeout(r,1000));
    if(ind)ind.textContent='✓';
    setTimeout(()=>{if(ind)ind.textContent='';},1500);
  }catch(e){
    if(ind)ind.textContent='Error';
    setTimeout(()=>{if(ind)ind.textContent='';},2000);
  }
}

function setFiltro(f,btn){
  filtroActual=f;
  document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderLista();
}
