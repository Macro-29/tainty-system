<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Producción · Tainty</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/common.css">
<style>
.topbar,.filters,.grid{position:relative;z-index:1}

.topbar-left{display:flex;align-items:center;gap:16px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.topbar-center{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);text-align:center}
.topbar-right{display:flex;align-items:center;gap:12px}
.stat-pill{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);color:var(--muted);background:var(--surface2);font-family:'DM Mono',monospace}
.stat-pill span{color:var(--text);font-weight:500}
.refresh-bar{width:60px;height:3px;background:var(--hint);border-radius:2px;overflow:hidden}
.refresh-fill{height:100%;background:var(--purple);border-radius:2px;animation:refill 60s linear infinite}
@keyframes refill{from{width:100%}to{width:0%}}
.admin-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.admin-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.admin-btn.active{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}

.filters{display:flex;gap:8px;padding:1rem 1.5rem 0;flex-wrap:wrap}
.filter-btn{font-family:'DM Sans',sans-serif;font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:1rem 1.5rem 2rem}

.ticket{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ticket:hover{border-color:var(--border2)}

.ticket-top{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.ticket-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--hint);margin-bottom:4px}
.ticket-product{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:6px}
.ticket-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qty-badge{font-size:12px;font-weight:500;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:2px 8px;color:var(--text);font-family:'DM Mono',monospace}
.client-name{font-size:12px;color:var(--muted)}

.progress-wrap{margin-top:2px}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.progress-label{font-size:11px;color:var(--hint)}
.progress-pct{font-family:'DM Mono',monospace;font-size:11px;font-weight:500}
.progress-track{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .5s ease}
.pct-0{background:var(--hint);width:0%}
.pct-done{background:var(--green)}

.ticket-insumos{padding:10px 16px;border-bottom:1px solid var(--border)}
.insumos-label{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.insumo-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);gap:8px}
.insumo-row:last-child{border-bottom:none}
.insumo-left{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.insumo-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.dot-pendiente{background:var(--hint)}
.dot-compra{background:var(--amber)}
.dot-produccion{background:var(--purple)}
.dot-camino{background:var(--blue)}
.dot-oficina{background:var(--green)}
.insumo-nombre{font-size:12px;color:var(--muted);white-space:nowrap}
.insumo-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.insumo-fecha{font-family:'DM Mono',monospace;font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--border2);background:var(--surface2);color:var(--hint)}
.insumo-fecha.hoy{color:var(--amber);border-color:rgba(245,166,35,.3);background:var(--amber-dim)}
.insumo-fecha.manana{color:var(--green);border-color:rgba(62,207,142,.3);background:var(--green-dim)}
.insumo-fecha.pronto{color:var(--blue);border-color:rgba(76,163,232,.3);background:var(--blue-dim)}
.insumo-fecha.pasado{color:var(--hint);border-color:var(--border);background:transparent;text-decoration:line-through;opacity:.6}
.dot-noaplica{background:var(--hint) !important;opacity:.4}
.chip-noaplica{background:transparent;color:var(--hint);border-color:var(--border);text-decoration:line-through;opacity:.6}
.ticket-estado-wrap{padding:8px 16px;border-top:1px solid var(--border);display:none}
.ticket-estado-wrap.admin{display:block}
.ticket-estado-label{font-size:10px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.ticket-estado-select{width:100%;font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer}
.ticket-estado-select:focus{outline:none;border-color:var(--purple)}
.nuevo-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--green-dim);color:var(--green);border:1px solid rgba(62,207,142,.3);letter-spacing:.04em;margin-left:6px;vertical-align:middle;animation:pulse 2s infinite}

.estado-select{font-family:'DM Sans',sans-serif;font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);cursor:pointer;display:none}
.estado-select.visible{display:block}
.estado-select:focus{outline:none;border-color:var(--purple)}

.estado-chip{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid transparent;white-space:nowrap}
.chip-pendiente{background:var(--surface2);color:var(--hint);border-color:var(--border2)}
.chip-compra{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.2)}
.chip-produccion{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.2)}
.chip-camino{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.2)}
.chip-oficina{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.2)}

.ticket-footer{padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.fecha-entrega{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.fecha-entrega strong{color:var(--text);font-weight:500}
.fecha-urgente{color:var(--red)!important}
.fecha-hoy-cl{color:var(--amber)!important}
.estado-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid transparent}
.estado-pendiente{background:var(--amber-dim);color:var(--amber);border-color:rgba(245,166,35,.2)}
.estado-produccion{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,111,239,.2)}
.estado-camino{background:var(--blue-dim);color:var(--blue);border-color:rgba(76,163,232,.2)}
.estado-listo{background:var(--green-dim);color:var(--green);border-color:rgba(62,207,142,.2)}
.estado-cancelado{background:var(--red-dim);color:var(--red);border-color:rgba(232,82,74,.2)}

.empty-state{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--hint)}
.empty-state p{font-size:15px;margin-top:8px}
.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px}
.spinner-ring{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}
}
.loading-text{font-size:14px;color:var(--muted)}
.error-wrap{grid-column:1/-1;background:var(--red-dim);border:1px solid rgba(232,82,74,.2);border-radius:12px;padding:1.5rem;text-align:center}
.error-wrap p{font-size:14px;color:var(--red);margin-bottom:8px}
.error-wrap button{font-size:13px;color:var(--muted);cursor:pointer;background:none;border:none}

/* PIN MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.visible{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:2rem;width:320px;text-align:center}
.modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
.pin-error{font-size:13px;color:var(--red);height:18px;margin-top:4px}
.modal-cancel{font-size:13px;color:var(--hint);background:none;border:none;cursor:pointer;margin-top:8px;padding:6px 16px}

/* SAVING INDICATOR */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--muted);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
@media(max-width:640px){
  .ticket-footer{flex-wrap:wrap;gap:6px}
  .ticket-estado-wrap{padding:8px 12px}
  .insumo-row{flex-wrap:wrap}
  .insumo-right{flex-wrap:wrap;gap:4px}

  .topbar{padding:.75rem 1rem;flex-wrap:wrap;gap:8px}
  .topbar-center{order:3;width:100%;font-size:11px;text-align:left}
  .topbar-right{gap:6px}
  .stat-pill{font-size:11px;padding:3px 8px}
  .refresh-bar{display:none}
  .filters{padding:.75rem 1rem 0;gap:6px}
  .filter-btn{font-size:11px;padding:4px 10px}
  .grid{grid-template-columns:1fr;padding:.75rem 1rem 1.5rem;gap:10px}
  .ticket-product{font-size:14px}
  .modal{width:90vw;max-width:320px;padding:1.5rem}
  .toast{bottom:16px;right:16px;left:16px;text-align:center}
  .insumo-nombre{font-size:11px}
  .insumo-fecha{font-size:10px}
  .ticket-estado-select{font-size:12px}
}
@media(min-width:641px) and (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .topbar-center{font-size:12px}
}

</style>
<script src="./assets/config.js"></script>
<script src="./assets/common.js"></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Tainty <span>Corp</span></div>
    <div class="live-dot"></div>
  </div>
  <div class="topbar-center"><div id="fecha-hora"></div></div>
  <div class="topbar-right">
    <div class="stat-pill">Activos: <span id="stat-activos">—</span></div>
    <div class="stat-pill">Pendientes: <span id="stat-pendientes">—</span></div>
    <div class="refresh-bar"><div class="refresh-fill" id="refresh-fill"></div></div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="setFiltro('todos',this)">Todos</button>
  <button class="filter-btn" onclick="setFiltro('recibido',this)">📬 Recibido</button>
  <button class="filter-btn" onclick="setFiltro('compras',this)">🛒 Compras</button>
  <button class="filter-btn" onclick="setFiltro('produccion',this)">⚙️ En producción</button>
  <button class="filter-btn" onclick="setFiltro('camino',this)">🚚 En camino</button>
  <button class="filter-btn" onclick="setFiltro('envio',this)">📦 Listo para envío</button>
  <button class="filter-btn" onclick="setFiltro('cancelado',this)">❌ Cancelado</button>
</div>

<div class="grid" id="grid">
  <div class="loading-wrap" style="grid-column:1/-1">
    <div class="spinner-ring"></div>
    <div class="loading-text">Conectando con Google Sheets...</div>
  </div>
</div>

<!-- PIN MODAL -->
<div class="modal-overlay" id="pin-modal">
  <div class="modal">
    <div class="modal-title">Modo administrador</div>
    <div class="modal-sub">Ingresa tu PIN para continuar</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
      <div class="pin-dot" id="pd4"></div>
      <div class="pin-dot" id="pd5"></div>
    </div>
    <div class="pin-grid">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-clear" onclick="pinClear()">⌫</button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <div></div>
    </div>
    <div class="pin-error" id="pin-error"></div>
    <button class="modal-cancel" onclick="cerrarModal()">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PIN_CORRECTO='200720';
const ESTADOS_INSUMO=['pendiente','compra','produccion','camino','oficina','noaplica'];
const ESTADOS_MAQUINA=['pendiente','encurso','finalizado'];
const LABELS_INSUMO={'pendiente':'⏳ Pendiente','compra':'🛒 En compra','produccion':'⚙️ En producción','camino':'🚚 En camino','oficina':'📦 En oficina','noaplica':'✕ No aplica','encurso':'⚙️ En curso','finalizado':'✅ Finalizado'};
const DOT_CLS={'pendiente':'dot-pendiente','compra':'dot-compra','produccion':'dot-produccion','camino':'dot-camino','oficina':'dot-oficina','noaplica':'dot-noaplica','encurso':'dot-produccion','finalizado':'dot-oficina'};
const CHIP_CLS={'pendiente':'chip-pendiente','compra':'chip-compra','produccion':'chip-produccion','camino':'chip-camino','oficina':'chip-oficina','noaplica':'chip-noaplica','encurso':'chip-produccion','finalizado':'chip-oficina'};
const ESTADOS_TICKET=['Recibido','Compras de insumos','En produccion','En camino','Listo para envio','Entregado'];
const LABELS_TICKET={'Recibido':'📬 Recibido','Compras de insumos':'🛒 Compras de insumos','En produccion':'⚙️ En producción','En camino':'🚚 En camino','Listo para envio':'📦 Listo para envío','Entregado':'✅ Entregado'};

let pedidos=[];
let estadosInsumos={};
let filtroActual='todos';
let adminMode=false;
let pinBuffer='';

function getTipo(n){
  n=(n||'').toLowerCase();
  if(/\(.*cap\)/.test(n))return'cap';
  if(/\(.*gr\)/.test(n))return'gr';
  return'ml';
}
function getInsumos(t){
  return t==='cap'?['Insumo','Capsula','Envase','Etiqueta','Caja','Maquina']:['Insumo','Envase','Etiqueta','Caja','Maquina'];
}
function sumarHabiles(base,dias){
  const d=new Date(base);let s=0;
  while(s<dias){d.setDate(d.getDate()+1);if(d.getDay()!==0)s++;}
  return d;
}
function parseFecha(str){
  if(!str)return null;
  if(str instanceof Date)return str;
  const s=str.toString().trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  const d=new Date(s);return isNaN(d)?null:d;
}
function fechaChip(d){
  if(!d||isNaN(d))return{label:'—',cls:''};
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const df=new Date(d);df.setHours(0,0,0,0);
  const diff=Math.round((df-hoy)/86400000);
  if(diff<0)return{label:df.toLocaleDateString('es-PE',{day:'numeric',month:'short'}),cls:'pasado'};
  if(diff===0)return{label:'Hoy',cls:'hoy'};
  if(diff===1)return{label:'Mañana',cls:'manana'};
  return{label:df.toLocaleDateString('es-PE',{day:'numeric',month:'short'}),cls:'pronto'};
}
function getFechasInsumos(tipo,fechaStr){
  const insumos=getInsumos(tipo);
  const base=parseFecha(fechaStr)||new Date();
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const baseD=new Date(base);baseD.setHours(0,0,0,0);
  const esTarde=baseD.getTime()===hoy.getTime()&&new Date().getHours()>=13;
  // Antes de 1pm: insumos +1, caja +2 | Después de 1pm: insumos +2, caja +3
  const d=esTarde?2:1;
  // Máquina usa la fecha tentativa de entrega del pedido
  const fechaEntrega=calcFechaTentativa(fechaStr);
  return insumos.map(nombre=>{
    if(nombre==='Maquina')return{nombre,fecha:fechaEntrega};
    return{nombre,fecha:sumarHabiles(base,nombre==='Caja'?d+1:d)};
  });
}

function calcFechaTentativa(fechaStr){
  const base=parseFecha(fechaStr)||new Date();
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const baseD=new Date(base);baseD.setHours(0,0,0,0);
  // Si el pedido es de hoy: antes 1pm = +4 dias habiles, despues 1pm = +5
  const esTarde=baseD.getTime()===hoy.getTime()&&new Date().getHours()>=13;
  return sumarHabiles(base,esTarde?5:4);
}
function getEstadoTicket(estado){
  const e=(estado||'').toLowerCase().trim();
  if(e.includes('cancelado'))return{cls:'estado-cancelado',icon:'❌',label:'Cancelado',key:'cancelado'};
  if(e.includes('compras'))return{cls:'estado-produccion',icon:'🛒',label:'Compras de insumos',key:'compras'};
  if(e.includes('produccion')||e.includes('producción'))return{cls:'estado-produccion',icon:'⚙️',label:'En producción',key:'produccion'};
  if(e.includes('camino'))return{cls:'estado-camino',icon:'🚚',label:'En camino',key:'camino'};
  if(e.includes('listo'))return{cls:'estado-listo',icon:'📦',label:'Listo para envío',key:'envio'};
  if(e.includes('entregado'))return{cls:'estado-listo',icon:'✅',label:'Entregado',key:'entregado'};
  if(e.includes('recibido'))return{cls:'estado-pendiente',icon:'📬',label:'Recibido',key:'recibido'};
  return{cls:'estado-pendiente',icon:'📬',label:'Recibido',key:'recibido'};
}

function calcEstadoAutomatico(pedidoId, tipo, estadoActual){
  // No tocar cancelados ni entregados
  const e=(estadoActual||'').toLowerCase();
  if(e.includes('cancelado')||e.includes('entregado')) return estadoActual;

  const insumos=getInsumos(tipo);
  // Insumos clave para determinar estado (excluir Etiqueta y Caja)
  const insumosClave=insumos.filter(i=>i==='Insumo'||i==='Capsula'||i==='Envase');

  const estados=insumosClave.map(i=>getEstadoInsumo(pedidoId,i));
  // "Listo para envío": todos los físicos en oficina + máquina finalizada
  const fisicos=insumos.filter(i=>i!=='Maquina'&&getEstadoInsumo(pedidoId,i)!=='noaplica');
  const todosFisicosOK=fisicos.every(i=>getEstadoInsumo(pedidoId,i)==='oficina');
  const maquinaOK=getEstadoInsumo(pedidoId,'Maquina')==='finalizado';
  const todosOficina=todosFisicosOK&&maquinaOK;
  const algunoCamino=estados.some(s=>s==='camino');
  const algunoProduccion=estados.some(s=>s==='produccion')||getEstadoInsumo(pedidoId,'Maquina')==='encurso';
  const algunoCompra=estados.some(s=>s==='compra');

  if(todosOficina) return 'Listo para envio';
  if(algunoCamino) return 'En camino';
  if(algunoProduccion) return 'En produccion';
  if(algunoCompra) return 'Compras de insumos';
  return 'Recibido';
}
function fechaEntregaLabel(str, fechaPedido){
  let f=parseFecha(str);
  // Si no tiene fecha tentativa, calcularla dinamicamente
  if(!f||isNaN(f)) f=calcFechaTentativa(fechaPedido);
  if(!f||isNaN(f))return null;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const diff=Math.round((f-hoy)/86400000);
  if(diff<0)return{text:'Vencido',cls:'fecha-urgente'};
  if(diff===0)return{text:'Hoy',cls:'fecha-hoy-cl'};
  if(diff===1)return{text:'Mañana',cls:''};
  return{text:f.toLocaleDateString('es-PE',{day:'numeric',month:'short'}),cls:''};
}
function getEstadoInsumo(pedidoId,insumo){
  return estadosInsumos[pedidoId+'|'+insumo]||'pendiente';
}
function calcProgreso(pedidoId,tipo){
  const insumos=getInsumos(tipo);
  const aplicables=insumos.filter(i=>getEstadoInsumo(pedidoId,i)!=='noaplica');
  if(!aplicables.length)return 100;
  const listos=aplicables.filter(i=>{
    const e=getEstadoInsumo(pedidoId,i);
    return i==='Maquina'?e==='finalizado':e==='oficina';
  }).length;
  return Math.round((listos/aplicables.length)*100);
}
function getProgressColor(pct){
  if(pct===0)return'var(--hint)';
  if(pct<50)return'var(--amber)';
  if(pct<100)return'var(--blue)';
  return'var(--green)';
}

function renderTicket(p){
  const tipo=getTipo(p.producto);
  // Calcular estado automatico basado en insumos
  const estadoDinamico=calcEstadoAutomatico(p.numPedido,tipo,p.estado);
  const est=getEstadoTicket(estadoDinamico);
  const fechas=getFechasInsumos(tipo,p.fecha);
  const entrega=fechaEntregaLabel(p.fechaTentativa,p.fecha);
  const pct=calcProgreso(p.numPedido,tipo);
  const insumos=getInsumos(tipo);

  const rows=fechas.map(({nombre,fecha})=>{
    const fc=fechaChip(fecha);
    const estadoIns=getEstadoInsumo(p.numPedido,nombre);
    const dotCls=DOT_CLS[estadoIns]||'dot-pendiente';
    const chipCls=CHIP_CLS[estadoIns]||'chip-pendiente';
    const selectVisible=adminMode?'visible':'';
    const estadosDisponibles=nombre==='Maquina'?ESTADOS_MAQUINA:ESTADOS_INSUMO;
    const opts=estadosDisponibles.map(s=>`<option value="${s}"${s===estadoIns?' selected':''}>${LABELS_INSUMO[s]}</option>`).join('');
    return`<div class="insumo-row">
      <div class="insumo-left">
        <span class="insumo-dot ${dotCls}"></span>
        <span class="insumo-nombre">${nombre}</span>
      </div>
      <div class="insumo-right">
        <span class="insumo-fecha ${fc.cls}">${fc.label}</span>
        ${adminMode
          ? `<select class="estado-select visible" onchange="cambiarEstado('${p.numPedido}','${nombre}',this.value)">${opts}</select>`
          : `<span class="estado-chip ${chipCls}">${LABELS_INSUMO[estadoIns]}</span>`
        }
      </div>
    </div>`;
  }).join('');

  const fechaHtml=entrega
    ?`<span class="fecha-entrega ${entrega.cls}">Entrega: <strong>${entrega.text}</strong></span>`
    :`<span class="fecha-entrega">Sin fecha</span>`;

  const estadoOptsTicket=ESTADOS_TICKET.map(s=>`<option value="${s}"${s===(p.estado||'')?' selected':''}>${LABELS_TICKET[s]||s}</option>`).join('');

  return`<div class="ticket">
    <div class="ticket-top">
      <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">
        <div class="ticket-num" style="margin:0">${p.numPedido||''}</div>
        ${esNuevo(p)?'<span class="nuevo-badge">NUEVO</span>':''}
        <button onclick="copiarMensajeCliente('${p.numPedido}')" title="Copiar mensaje para el cliente" style="margin-left:auto;font-size:11px;padding:3px 9px;border-radius:7px;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);cursor:pointer;white-space:nowrap">&#128203; Cliente</button>
      </div>
      <div class="ticket-product">${p.producto||'—'}</div>
      <div class="ticket-meta">
        <span class="qty-badge">${parseInt(p.cantidad||0).toLocaleString()} und</span>
        <span class="client-name">${p.cliente||''}</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-label">Progreso de producción</span>
          <span class="progress-pct" style="color:${getProgressColor(pct)}">${pct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" style="width:${pct}%;background:${getProgressColor(pct)}"></div>
        </div>
      </div>
    </div>
    <div class="ticket-insumos">
      <div class="insumos-label">Cronograma de insumos</div>
      ${rows}
    </div>
    <div class="ticket-footer">${fechaHtml}<span class="estado-badge ${est.cls}">${est.icon} ${est.label}</span></div>
    <div class="ticket-estado-wrap${adminMode?' admin':''}">
      <div class="ticket-estado-label">Cambiar estado del pedido</div>
      <select class="ticket-estado-select" onchange="cambiarEstadoTicket('${p.numPedido}',this.value,this)">${estadoOptsTicket}</select>
    </div>
  </div>`;
}

/**
 * Copia al portapapeles un mensaje listo para enviar al cliente con:
 * número de pedido, producto, cantidad y fecha aproximada de entrega.
 */
function copiarMensajeCliente(numPedido){
  const p=pedidos.find(x=>x.numPedido===numPedido);
  if(!p){mostrarToast('Pedido no encontrado',{type:'error',duration:2500});return;}
  const cant=parseInt(p.cantidad||0).toLocaleString('es-PE');
  // Fecha de entrega: usa la tentativa guardada o la calcula desde la fecha del pedido
  let fEntrega=parseFecha(p.fechaTentativa);
  if(!fEntrega||isNaN(fEntrega)) fEntrega=calcFechaTentativa(p.fecha);
  const fechaStr=(fEntrega&&!isNaN(fEntrega))
    ? fEntrega.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'})
    : 'por confirmar';
  const texto=[
    'Hola 🙋🏼‍♂️ Te comparto el estado de tu pedido',
    '',
    `📋 Pedido: ${p.numPedido||''}`,
    `📦 Producto: ${p.producto||''}`,
    `🔢 Cantidad: ${cant} unidades`,
    `📅 Entrega aproximada: ${fechaStr} por la tarde`,
    '',
    '¡Gracias por su preferencia! 🙌'
  ].join('\n');
  navigator.clipboard.writeText(texto)
    .then(()=>mostrarToast('Mensaje para '+(p.cliente||'cliente')+' copiado',{type:'success',duration:2500}))
    .catch(()=>mostrarToast('No se pudo copiar',{type:'error',duration:3000}));
}

function esNuevo(p){
  const f=parseFecha(p.fecha);
  if(!f||isNaN(f))return false;
  return(new Date()-f)<172800000;
}

function renderGrid(){
  const grid=document.getElementById('grid');
  let lista=pedidos.filter(p=>{
    const e=(p.estado||'').toLowerCase();
    if(e.includes('entregado'))return false;
    const esCancelado=e.includes('cancelado');
    if(filtroActual==='todos')return!esCancelado;
    if(filtroActual==='cancelado')return esCancelado;
    if(filtroActual==='envio')return e.includes('listo')||e.includes('envio')||e.includes('envío');
    if(filtroActual==='recibido')return e.includes('recibido');
    if(filtroActual==='compras')return e.includes('compras');
    if(filtroActual==='camino')return e.includes('camino');
    return e.includes(filtroActual);
  });
  lista=lista.slice().sort((a,b)=>{
    const na=parseInt((a.numPedido||'P0').replace('P',''))||0;
    const nb=parseInt((b.numPedido||'P0').replace('P',''))||0;
    return nb-na;
  });
  const activos=pedidos.filter(p=>{const e=(p.estado||'').toLowerCase();return!e.includes('entregado')&&!e.includes('cancelado');}).length;
  const pend=pedidos.filter(p=>(p.estado||'').toLowerCase().includes('pendiente')).length;
  document.getElementById('stat-activos').textContent=activos;
  document.getElementById('stat-pendientes').textContent=pend;
  if(!lista.length){grid.innerHTML=`<div class="empty-state"><div style="font-size:32px">📭</div><p>No hay pedidos en esta categoría</p></div>`;return;}
  grid.innerHTML=lista.map(renderTicket).join('');
}

async function cambiarEstado(pedidoId,insumo,estado){
  estadosInsumos[pedidoId+'|'+insumo]=estado;
  renderGrid();
  mostrarToast('Guardando...', 0);
  try{
    const form=new FormData();
    form.append('action','setEstado');
    form.append('pedido',pedidoId);
    form.append('insumo',insumo);
    form.append('estado',estado);
    await fetch(SCRIPT_URL,{method:'POST',body:form,mode:'no-cors'});
    mostrarToast('✓ Guardado', {type:'success',duration:3000});
    setTimeout(()=>ocultarToast(),1500);
  }catch(e){
    mostrarToast('Error al guardar', {type:'error',duration:3500});
    setTimeout(()=>ocultarToast(),2000);
  }
}

async function cambiarEstadoTicket(pedidoId, nuevoEstado, selectEl){
  const pedido = pedidos.find(p=>p.numPedido===pedidoId);
  if(pedido) pedido.estado = nuevoEstado;
  renderGrid();
  mostrarToast('Guardando estado...');
  try{
    const form=new FormData();
    form.append('action','setEstadoTicket');
    form.append('pedido',pedidoId);
    form.append('estado',nuevoEstado);
    await fetch(SCRIPT_URL,{method:'POST',body:form,mode:'no-cors'});
    mostrarToast('✓ Estado actualizado', {type:'success',duration:3000});
    setTimeout(()=>{ocultarToast();renderGrid();},1500);
  }catch(e){
    mostrarToast('Error al guardar', {type:'error',duration:3500});
    setTimeout(()=>ocultarToast(),2000);
  }
}


async function cargarPedidos(){
  try{
    const [dp,de]=await Promise.all([
      jsonp(`${SCRIPT_URL}?action=panel&t=${Date.now()}`),
      jsonp(`${SCRIPT_URL}?action=estados&t=${Date.now()}`)
    ]);
    if(dp.success&&dp.pedidos)pedidos=dp.pedidos;
    if(de.success&&de.estados)estadosInsumos=de.estados;
    renderGrid();
  }catch(err){
    if(!pedidos.length)document.getElementById('grid').innerHTML=`<div class="error-wrap"><p>No se pudo conectar con Google Sheets.</p><button onclick="cargarPedidos()">Reintentar</button></div>`;
  }
}

function setFiltro(f,btn){
  filtroActual=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function toggleAdmin(){
  if(adminMode){
    adminMode=false;
    document.getElementById('admin-btn').textContent='🔒 Admin';
    document.getElementById('admin-btn').classList.remove('active');
    renderGrid();
  } else {
    abrirModal();
  }
}

function abrirModal(){
  pinBuffer='';
  actualizarDots();
  document.getElementById('pin-error').textContent='';
  document.getElementById('pin-modal').classList.add('visible');
}
function cerrarModal(){
  document.getElementById('pin-modal').classList.remove('visible');
  pinBuffer='';
  actualizarDots();
}
function pinPress(d){
  if(pinBuffer.length>=6)return;
  pinBuffer+=d;
  actualizarDots();
  if(pinBuffer.length===6){
    setTimeout(()=>{
      if(pinBuffer===PIN_CORRECTO){
        adminMode=true;
        cerrarModal();
        document.getElementById('admin-btn').textContent='🔓 Admin';
        document.getElementById('admin-btn').classList.add('active');
        renderGrid();
      } else {
        document.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('error'));
        document.getElementById('pin-error').textContent='PIN incorrecto';
        setTimeout(()=>{
          pinBuffer='';
          actualizarDots();
          document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('error'));
          document.getElementById('pin-error').textContent='';
        },800);
      }
    },100);
  }
}
function pinClear(){
  pinBuffer=pinBuffer.slice(0,-1);
  actualizarDots();
}
function actualizarDots(){
  for(let i=0;i<6;i++){
    const dot=document.getElementById('pd'+i);
    dot.classList.toggle('filled',i<pinBuffer.length);
    dot.classList.remove('error');
  }
}

function actualizarReloj(){
  const ahora=new Date();
  document.getElementById('fecha-hora').textContent=
    ahora.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})+' · '+
    ahora.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function reiniciarBarra(){
  const f=document.getElementById('refresh-fill');
  f.style.animation='none';f.offsetHeight;f.style.animation='refill 60s linear infinite';
}

cargarPedidos();
actualizarReloj();
setInterval(actualizarReloj,1000);
setInterval(()=>{cargarPedidos();reiniciarBarra();},60000);
</script>
