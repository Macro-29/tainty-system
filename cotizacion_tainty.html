<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0f">
<title>Tainty Labs · Cotizaciones</title>
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/common.css">
<style>
body{padding-bottom:4rem}
.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1rem}

/* ---------- Layout de 2 columnas: formulario + vista previa ---------- */
.cot-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;align-items:start}
@media(max-width:960px){.cot-grid{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.1rem 1.15rem;margin-bottom:1rem}
.panel-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:.9rem}
.panel-title .num{width:22px;height:22px;border-radius:7px;background:var(--purple-dim);color:var(--purple);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.panel-title .hint{font-size:11px;font-weight:400;color:var(--hint);margin-left:auto;letter-spacing:0}

/* Campos */
.field{margin-bottom:.7rem}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field .req{color:var(--red)}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;
  padding:9px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border-color .15s}
.inp:focus{outline:none;border-color:var(--purple)}
.inp::placeholder{color:var(--hint)}
textarea.inp{resize:vertical;min-height:56px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
@media(max-width:560px){.row2,.row3{grid-template-columns:1fr}}

/* Detalles colapsables (datos de empresa) */
details.emp{margin-bottom:1rem}
details.emp>summary{list-style:none;cursor:pointer;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:.85rem 1.1rem;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:9px}
details.emp>summary::-webkit-details-marker{display:none}
details.emp>summary .chev{margin-left:auto;color:var(--hint);transition:transform .2s}
details.emp[open]>summary .chev{transform:rotate(90deg)}
details.emp[open]>summary{border-radius:14px 14px 0 0;border-bottom:none}
details.emp .emp-body{background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:1.1rem}

/* Líneas de producto */
.linea{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.8rem;margin-bottom:.7rem;position:relative}
.linea-head{display:flex;align-items:center;margin-bottom:.6rem}
.linea-tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.linea-del{margin-left:auto;background:none;border:1px solid var(--border2);color:var(--muted);border-radius:8px;
  width:26px;height:26px;cursor:pointer;font-size:13px;line-height:1;transition:all .15s}
.linea-del:hover{color:var(--red);border-color:var(--red)}
.linea-grid{display:grid;grid-template-columns:1fr;gap:.55rem}
.linea-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.55rem}
@media(max-width:560px){.linea-nums{grid-template-columns:1fr 1fr}}
.mini-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;display:block}
.linea-total{font-size:12px;color:var(--muted);text-align:right;margin-top:.5rem}
.linea-total b{color:var(--green);font-size:14px;font-family:'Syne',sans-serif}
.ps-tip{font-size:11px;color:var(--teal);margin-top:4px;display:none}
.ps-tip.show{display:block}
.qty-chips{display:flex;align-items:center;gap:6px;margin-top:.55rem;flex-wrap:wrap}
.qty-chips-lbl{font-size:11px;color:var(--muted);margin-right:2px}
.qty-chips button{background:var(--surface);border:1px solid var(--border2);color:var(--muted);border-radius:8px;padding:5px 13px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;transition:all .15s}
.qty-chips button:hover{border-color:var(--purple);color:var(--purple)}
.qty-chips button.active{background:var(--purple-dim);border-color:var(--purple);color:var(--purple)}

.btn-add{width:100%;background:var(--purple-dim);border:1px dashed rgba(124,111,239,.4);color:var(--purple);
  border-radius:11px;padding:11px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s}
.btn-add:hover{background:rgba(124,111,239,.2)}

/* Toggle IGV */
.igv-box{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:12px;padding:.85rem 1rem}
.igv-box .igv-info{flex:1;min-width:0}
.igv-box .igv-info .t{font-size:13px;color:var(--text);font-weight:500}
.igv-box .igv-info .s{font-size:11px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border2);border-radius:26px;cursor:pointer;transition:.2s}
.slider::before{content:'';position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--purple)}
.switch input:checked+.slider::before{transform:translateX(20px)}

/* Botones de acción */
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.btn{flex:1;min-width:130px;border:none;border-radius:11px;padding:12px 14px;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-pdf{background:var(--purple);color:#fff}
.btn-pdf:hover{opacity:.88}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2);flex:0 0 auto;min-width:auto;padding:12px 16px}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Vista previa (réplica del PDF, sobre fondo blanco) ---------- */
.preview-sticky{position:sticky;top:1rem}
.doc{background:#fff;color:#222;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px -12px rgba(0,0,0,.5);font-size:12px;line-height:1.4}
.doc *{box-sizing:border-box}
.doc-head{display:flex;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:2px solid #ececec}
.doc-emp .en{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#111;letter-spacing:.02em}
.doc-emp .el{color:#666;font-size:10.5px;margin-top:3px;line-height:1.5}
.doc-badge{text-align:right;min-width:150px}
.doc-badge .ruc{font-size:10px;color:#333;font-weight:600}
.doc-badge .cot{margin-top:6px;border:1.5px solid #7c6fef;border-radius:8px;padding:7px 10px}
.doc-badge .cot .l{font-family:'Syne',sans-serif;font-weight:700;color:#7c6fef;font-size:12px;letter-spacing:.08em}
.doc-badge .cot .n{font-size:13px;font-weight:700;color:#111;margin-top:1px}
.doc-meta{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;background:#f7f7fa;font-size:11px}
.doc-meta .cli{flex:1;min-width:0}
.doc-meta .cli .kv{margin-bottom:2px}
.doc-meta .cli .kv b,.doc-meta .fch .kv b{color:#111}
.doc-meta .cli .kv span,.doc-meta .fch .kv span{color:#555}
.doc-meta .fch{text-align:right;white-space:nowrap}
table.doc-tbl{width:100%;border-collapse:collapse;font-size:11px}
table.doc-tbl th{background:#2a2a33;color:#fff;padding:7px 8px;text-align:left;font-size:10px;letter-spacing:.03em;font-weight:600}
table.doc-tbl th.r,table.doc-tbl td.r{text-align:right}
table.doc-tbl th.c,table.doc-tbl td.c{text-align:center}
table.doc-tbl td{padding:7px 8px;border-bottom:1px solid #eee;color:#333}
table.doc-tbl tr:nth-child(even) td{background:#fafafa}
.doc-tot{display:flex;justify-content:flex-end;padding:10px 18px}
.doc-tot table{font-size:12px}
.doc-tot td{padding:3px 0 3px 22px;text-align:right;color:#444}
.doc-tot td.lbl{color:#666}
.doc-tot tr.grand td{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:#111;border-top:1.5px solid #ddd;padding-top:7px}
.doc-tot tr.grand td.lbl{color:#7c6fef}
.doc-obs{padding:2px 18px 10px;font-size:10.5px;color:#555}
.doc-obs b{color:#111}
.doc-note{margin:2px 18px 10px;background:#fff7ec;border:1px solid #f5d9a8;border-radius:8px;padding:8px 11px;font-size:10px;color:#8a5a12;line-height:1.5}
.doc-bank{margin:0 18px 14px;background:#f7f7fa;border-radius:8px;padding:10px 12px;font-size:10px;color:#444}
.doc-bank .bt{font-weight:700;color:#111;margin-bottom:4px;font-size:10px}
.doc-foot{border-top:1px solid #ececec;padding:11px 18px;text-align:center;font-size:10px;color:#888;line-height:1.5}
.doc-foot .doc-web{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:#7c6fef;margin-bottom:3px}
.doc-foot .doc-foot-igv{margin-top:4px;color:#b3b3bb;font-size:9px}
.doc-empty{padding:26px 18px;text-align:center;color:#aaa;font-size:12px}

.preview-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);margin:0 2px 10px;display:flex;align-items:center;gap:8px}
.preview-label::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
<script src="./assets/auth.js"></script>
</head>
<body>
<div class="topbar">
  <div class="logo">Tainty <span>Labs</span> &middot; Cotizaciones</div>
  <div class="topbar-right">
    <button class="lock-btn" id="btn-refresh" onclick="recargarCatalogos()" title="Recargar productos y precios">&#x21bb; Refrescar</button>
    <a class="back-btn" href="./index.html">&#8592; Inicio</a>
    <button class="lock-btn" onclick="cerrarSesion()">&#128274; Salir</button>
  </div>
</div>

<div class="wrap">
<div class="cot-grid">

  <!-- ============ COLUMNA IZQUIERDA: FORMULARIO ============ -->
  <div>
    <!-- Datos de mi empresa (editables, se guardan en el navegador) -->
    <details class="emp" id="emp-details">
      <summary>&#127970; Datos de mi empresa <span style="font-weight:400;color:var(--hint);font-size:11px">(salen en el PDF)</span> <span class="chev">&#8250;</span></summary>
      <div class="emp-body">
        <div class="field"><label>Logo <span style="color:var(--hint)">(PNG, ideal con fondo transparente)</span></label>
          <div style="display:flex;align-items:center;gap:12px">
            <div id="logo-prev" style="width:70px;height:46px;border:1px solid var(--border2);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--surface2);overflow:hidden;color:var(--hint);font-size:10px;flex-shrink:0">sin logo</div>
            <label class="btn-add" style="width:auto;padding:9px 14px;margin:0;cursor:pointer">Subir logo
              <input type="file" id="e-logo" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="onLogoFile(event)"></label>
            <button type="button" class="linea-del" id="btn-logo-del" title="Quitar logo" onclick="quitarLogo()" style="display:none">&#10005;</button>
          </div>
        </div>
        <div class="field"><label>Raz&oacute;n social</label><input class="inp" id="e-nombre" placeholder="TAINTY CORPORATION TRADING S.A.C."></div>
        <div class="row2">
          <div class="field"><label>RUC</label><input class="inp" id="e-ruc" placeholder="20xxxxxxxxx"></div>
          <div class="field"><label>Tel&eacute;fono</label><input class="inp" id="e-tel" placeholder="+51 9xx xxx xxx"></div>
        </div>
        <div class="field"><label>Direcci&oacute;n</label><input class="inp" id="e-dir" placeholder="Av. ... - Lima"></div>
        <div class="row2">
          <div class="field"><label>Email</label><input class="inp" id="e-email" placeholder="ventas@tainty.pe"></div>
          <div class="field"><label>Web</label><input class="inp" id="e-web" placeholder="www.tainty.pe"></div>
        </div>
        <div class="field"><label>Cuentas bancarias <span style="color:var(--hint)">(una por l&iacute;nea)</span></label>
          <textarea class="inp" id="e-bancos" rows="3" placeholder="BCP Soles: 193-xxxxxxx-0-xx  ·  CCI: 002-193-..."></textarea></div>
        <div style="font-size:11px;color:var(--hint);margin-top:4px">Se guarda solo en este navegador. Ll&eacute;nalo una vez.</div>
      </div>
    </details>

    <!-- Cliente -->
    <div class="panel">
      <div class="panel-title"><span class="num">1</span>Cliente</div>
      <div class="field"><label>Raz&oacute;n social / Nombre <span class="req">*</span></label>
        <input class="inp" id="c-nombre" list="clientes-list" placeholder="Cliente..." autocomplete="off"></div>
      <datalist id="clientes-list"></datalist>
      <div class="row2">
        <div class="field"><label>DNI / RUC</label><input class="inp" id="c-doc" placeholder="Opcional"></div>
        <div class="field"><label>Direcci&oacute;n</label><input class="inp" id="c-dir" placeholder="Opcional"></div>
      </div>
    </div>

    <!-- Datos de la cotización -->
    <div class="panel">
      <div class="panel-title"><span class="num">2</span>Cotizaci&oacute;n</div>
      <div class="row3">
        <div class="field"><label>N&uacute;mero <span style="color:var(--hint)">(autom&aacute;tico)</span></label><input class="inp" id="q-num" readonly tabindex="-1" title="Se genera solo al exportar (a&ntilde;o+d&iacute;a+mes+hora+minuto)" style="color:var(--muted)"></div>
        <div class="field"><label>Fecha emisi&oacute;n</label><input class="inp" type="date" id="q-fecha"></div>
        <div class="field"><label>V&aacute;lida (d&iacute;as)</label><input class="inp" type="number" id="q-dias" value="1" min="0" onchange="render()" oninput="render()"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Vendedor</label><input class="inp" id="q-vend" placeholder="Opcional"></div>
        <div class="field"><label>Moneda</label>
          <select class="inp" id="q-moneda" onchange="render()"><option value="S/">Soles (S/)</option><option value="US$">D&oacute;lares (US$)</option></select></div>
      </div>
    </div>

    <!-- Productos -->
    <div class="panel">
      <div class="panel-title"><span class="num">3</span>Productos
        <span class="hint" id="hint-prod">Cargando cat&aacute;logo...</span></div>
      <datalist id="productos-list"></datalist>
      <div id="lineas"></div>
      <button class="btn-add" onclick="agregarLinea()">+ Agregar producto</button>
    </div>

    <!-- IGV + Observaciones -->
    <div class="panel">
      <div class="panel-title"><span class="num">4</span>Total y opciones</div>
      <div class="igv-box" style="margin-bottom:.85rem">
        <div class="igv-info">
          <div class="t">Agregar IGV (18%)</div>
          <div class="s" id="igv-sub">Los precios se toman netos; al activar se suma 18%.</div>
        </div>
        <label class="switch"><input type="checkbox" id="chk-igv" onchange="render()"><span class="slider"></span></label>
      </div>
      <div class="field"><label>Observaciones</label>
        <textarea class="inp" id="q-obs" placeholder="Condiciones, tiempo de entrega, etc. (opcional)" oninput="render()"></textarea></div>
    </div>

    <div class="actions">
      <button class="btn btn-pdf" id="btn-pdf" onclick="descargarPDF()">&#128196; Descargar PDF</button>
      <button class="btn btn-ghost" onclick="copiarTexto()" title="Copiar cotizaci&oacute;n como texto">&#128203; Copiar</button>
      <button class="btn btn-ghost" onclick="nuevaCotizacion()" title="Limpiar y empezar de cero">&#10012; Nueva</button>
    </div>
  </div>

  <!-- ============ COLUMNA DERECHA: VISTA PREVIA ============ -->
  <div>
    <div class="preview-sticky">
      <div class="preview-label">Vista previa</div>
      <div class="doc" id="doc"></div>
    </div>
  </div>

</div>
</div>

<script src="./assets/config.js"></script>
<script src="./assets/common.js"></script>
<script>
/* =========================================================
   Cotizaciones rápidas — Tainty Labs
   - Productos y clientes se cargan del backend (JSONP).
   - El precio unitario se autocompleta con el ÚLTIMO precio
     de venta de ese producto en el historial (action=analytics),
     y siempre es editable.
   - IGV: precios netos + 18% opcional.
   - PDF: descarga directa con jsPDF + autotable (CDN, carga diferida).
   ========================================================= */

// Auth gate: si no hay sesión, redirige al index.
if (!requireLogin()) { throw new Error('sin sesión'); }

const IGV_RATE = 0.18;
const EMP_KEY = 'tainty_empresa';
const LOGO_KEY = 'tainty_logo';
const NOTA_SIN_IGV = 'Los precios mostrados NO incluyen IGV, por lo que no se emite factura. Si necesitas factura, se agrega el 18% de IGV al precio por unidad.';
const AVISO_L1 = 'Por favor, revisar los detalles del producto, cantidad y precio unitario.';
const AVISO_L2 = 'No aceptamos cambios o devoluciones.';

let listaProductos = [];
let listaClientes  = [];
let precioPorProducto = {};   // nombreNorm -> { precio, fecha }
let lineaSeq = 0;
let lineas = [];              // ids activos, en orden
let logo = null;              // { dataUrl, w, h } o null

/* ---------- Utilidades ---------- */
function norm(s){
  let v = (s == null ? '' : s.toString()).trim().toUpperCase();
  if (v.normalize) v = v.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return v.replace(/\s+/g,' ');
}
function money(n, sym){
  const cur = sym || document.getElementById('q-moneda').value || 'S/';
  return cur + ' ' + (Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){ return (s==null?'':s.toString()).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fechaLarga(d){
  return d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});
}

/* ---------- Carga de catálogos y precios ---------- */
async function cargarCatalogos(){
  const hint = document.getElementById('hint-prod');
  try {
    const [resP, resC, resA] = await Promise.all([
      jsonp(`${SCRIPT_URL}?action=productos`),
      jsonp(`${SCRIPT_URL}?action=clientes`),
      jsonp(`${SCRIPT_URL}?action=analytics`)
    ]);
    if (resP && resP.success && Array.isArray(resP.data)) {
      listaProductos = resP.data;
      renderDatalist('productos-list', listaProductos);
    }
    if (resC && resC.success && Array.isArray(resC.data)) {
      listaClientes = resC.data;
      renderDatalist('clientes-list', listaClientes);
    }
    if (resA && resA.success && Array.isArray(resA.rows)) {
      construirPrecios(resA.rows);
    }
    const nP = listaProductos.length, nPr = Object.keys(precioPorProducto).length;
    hint.textContent = `${nP} productos · ${nPr} con precio`;
  } catch (e) {
    hint.textContent = 'No se pudo cargar el catálogo';
    mostrarToast('Error al cargar catálogo: ' + (e.message||''), {type:'error',duration:3500});
  }
}

/** Construye el mapa nombre→último precio de venta (>0) usando la fecha más reciente. */
function construirPrecios(rows){
  const map = {};
  rows.forEach((r, i) => {
    const nom = norm(r.producto);
    const precio = parseFloat(r.precio) || 0;
    if (!nom || precio <= 0) return;
    const t = r.fecha ? new Date(r.fecha).getTime() : 0;
    const orden = isNaN(t) ? i : t;      // sin fecha válida: gana la fila más nueva
    if (!map[nom] || orden >= map[nom].orden) {
      map[nom] = { precio, orden, fecha: r.fecha };
    }
  });
  precioPorProducto = map;
}

function renderDatalist(id, items){
  const dl = document.getElementById(id);
  if (dl) dl.innerHTML = items.map(v => `<option value="${esc(v).replace(/"/g,'&quot;')}">`).join('');
}

/* ---------- Líneas de producto ---------- */
function agregarLinea(prefill){
  const n = ++lineaSeq;
  lineas.push(n);
  const div = document.createElement('div');
  div.className = 'linea';
  div.id = 'linea-' + n;
  div.innerHTML = `
    <div class="linea-head">
      <span class="linea-tag">Producto ${lineas.length}</span>
      <button class="linea-del" title="Quitar" onclick="removerLinea(${n})">&#10005;</button>
    </div>
    <div class="linea-grid">
      <div>
        <span class="mini-lbl">Producto / descripci&oacute;n</span>
        <input class="inp" id="prod-${n}" list="productos-list" placeholder="Escribe o elige..." autocomplete="off"
               oninput="onProdInput(${n})" onchange="onProdChange(${n})">
        <div class="ps-tip" id="tip-${n}"></div>
      </div>
      <div class="linea-nums">
        <div><span class="mini-lbl">Cantidad</span>
          <input class="inp" type="number" id="cant-${n}" min="0" step="1" value="100" oninput="onCantInput(${n})"></div>
        <div><span class="mini-lbl">P. unit.</span>

  const hit = precioPorProducto[norm(prod)];

/* ---------- Cálculo + vista previa ---------- */
function leerLineas(){
  return lineas.map(n => {
    const prod = (document.getElementById('prod-'+n)?.value || '').trim();
    const cant = parseFloat(document.getElementById('cant-'+n)?.value) || 0;
    const precio = parseFloat(document.getElementById('precio-'+n)?.value) || 0;
    const total = cant * precio;
    const totEl = document.getElementById('tot-'+n);
    if (totEl) totEl.value = total > 0 ? money(total) : '';
    return { n, prod, cant, precio, total, valida: !!prod && cant > 0 && precio > 0 };
  });
}

function calcular(){
  const items = leerLineas().filter(l => l.valida);
  const subtotal = items.reduce((s,l) => s + l.total, 0);
  const conIGV = document.getElementById('chk-igv').checked;
  const igv = conIGV ? subtotal * IGV_RATE : 0;
  return { items, subtotal, conIGV, igv, total: subtotal + igv };
}

/* ---------- Logo (subido por el usuario, persistido en el navegador) ---------- */
function aplicarLogo(dataUrl, persist){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      logo = { dataUrl, w: img.naturalWidth, h: img.naturalHeight };
      if (persist){ try { localStorage.setItem(LOGO_KEY, dataUrl); } catch(_){} }
      renderLogoPrev(); render(); resolve(true);
    };
    img.onerror = () => resolve(false);
    img.src = dataUrl;
  });
}
function onLogoFile(ev){
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  if (f.size > 3 * 1024 * 1024){ mostrarToast('El logo debe pesar menos de 3 MB', {type:'error',duration:3500}); return; }
  const r = new FileReader();
  r.onload = () => {
    // Normaliza a PNG (conserva transparencia) y limita el tamaño para el PDF.
    const img = new Image();
    img.onload = () => {
      const maxDim = 600;
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * sc); h = Math.round(h * sc);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      aplicarLogo(cv.toDataURL('image/png'), true)
        .then(ok => { if (ok) mostrarToast('Logo actualizado', {type:'success',duration:2000}); });
    };
    img.onerror = () => mostrarToast('No se pudo leer la imagen', {type:'error',duration:3000});
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function quitarLogo(){
  logo = null;
  try { localStorage.removeItem(LOGO_KEY); } catch(_){}
  const inp = document.getElementById('e-logo'); if (inp) inp.value = '';
  renderLogoPrev(); render();
}
function renderLogoPrev(){
  const prev = document.getElementById('logo-prev');
  const del = document.getElementById('btn-logo-del');
  if (!prev) return;
  if (logo){
    prev.innerHTML = `<img src="${logo.dataUrl}" style="max-width:100%;max-height:100%;object-fit:contain">`;
    if (del) del.style.display = '';
  } else {
    prev.textContent = 'sin logo';
    if (del) del.style.display = 'none';
  }
}
async function cargarLogo(){
  let stored = null;
  try { stored = localStorage.getItem(LOGO_KEY); } catch(_){}
  if (stored){ await aplicarLogo(stored, false); return; }
  // Logo por defecto si existe en el repo (./assets/logo.png).
  try {
    const res = await fetch('./assets/logo.png', { cache:'no-store' });
    if (res.ok){
      const blob = await res.blob();
      const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      await aplicarLogo(dataUrl, false);
    }
  } catch(_){}
}

/**
 * Numero de cotizacion automatico con formato AAAADDMMHHmm.
 * Ej: 13/08/2026 11:52 -> "202613081152" (anio+dia+mes+hora+minuto, 24h).
 */
function numeroCotizacion(d){
  d = d || new Date();
  const p = n => String(n).padStart(2, '0');
  return '' + d.getFullYear() + p(d.getDate()) + p(d.getMonth() + 1) + p(d.getHours()) + p(d.getMinutes());
}

/* ---------- Generación de PDF (jsPDF + autotable, carga diferida) ---------- */
let _pdfLibsReady = false;
function cargarScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar '+src));
    document.head.appendChild(s);
  });
}
async function asegurarLibsPDF(){
  if (_pdfLibsReady && window.jspdf) return;
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  _pdfLibsReady = true;
}

      pdf.text(k, lblX, y);
      pdf.setTextColor(big?20:70, big?20:70, big?25:75);
      pdf.text(v, tx, y, {align:'right'}); y += big?20:15;
    };
    if (c.conIGV){ totLine('Subtotal', money(c.subtotal,sym)); totLine('IGV (18%)', money(c.igv,sym)); }
    pdf.setDrawColor(220,220,220); pdf.line(lblX, y-4, tx, y-4);
    totLine('TOTAL', money(c.total,sym), true);

    // --- Observaciones ---
    if (q.obs){
      y += 6; ensure(30);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(9); pdf.setTextColor(30,30,35);
      pdf.text('Observaciones:', M, y);
      pdf.setFont('helvetica','normal'); pdf.setTextColor(...GREY);
      const ow = pdf.splitTextToSize(q.obs, W - 2*M - 80);
      pdf.text(ow, M + 78, y); y += ow.length * 12 + 4;
    }

    // --- Nota automática cuando NO se incluye IGV ---
    if (!c.conIGV){
      y += 8;
      const nw = pdf.splitTextToSize(NOTA_SIN_IGV, W - 2*M - 20);
      const nh = 14 + nw.length * 11;
      ensure(nh);
      pdf.setFillColor(255,247,236); pdf.setDrawColor(245,217,168); pdf.setLineWidth(0.7);
      pdf.roundedRect(M, y, W - 2*M, nh, 4, 4, 'FD');
      pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(138,90,18);
      let ny = y + 15; nw.forEach(t => { pdf.text(t, M + 10, ny); ny += 11; });
      y += nh;
    }

    // --- Cuentas bancarias ---
    if (e.bancos){
      y += 8;
      ensure(16 + e.bancos.split('\n').filter(Boolean).length * 12);
      const bl = e.bancos.split('\n').filter(Boolean);
      const bh = 16 + bl.length*12;
      pdf.setFillColor(247,247,250); pdf.setDrawColor(236,236,240);
      pdf.roundedRect(M, y, W - 2*M, bh, 4, 4, 'FD');
      pdf.setFont('helvetica','bold'); pdf.setFontSize(8.5); pdf.setTextColor(30,30,35);
      pdf.text('CUENTAS BANCARIAS', M+10, y+13);
      pdf.setFont('helvetica','normal'); pdf.setTextColor(...GREY);
      let by = y + 25; bl.forEach(t => { pdf.text(t, M+10, by); by += 12; });
      y += bh;
    }

    // --- Pie: web + aviso (estilo cotización) ---
    const footTop = H - 56;
    pdf.setDrawColor(230,230,236); pdf.setLineWidth(0.7);
    pdf.line(M, footTop, W - M, footTop);
    let fy = footTop + 15;
    if (e.web){
      pdf.setFont('helvetica','bold'); pdf.setFontSize(12); pdf.setTextColor(...PURPLE);
      pdf.text(e.web, W/2, fy, {align:'center'}); fy += 14;
    }
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8.5); pdf.setTextColor(120,120,128);
    pdf.text(AVISO_L1, W/2, fy, {align:'center'}); fy += 11;
    pdf.text(AVISO_L2, W/2, fy, {align:'center'}); fy += 11;
    pdf.setFontSize(7.5); pdf.setTextColor(170,170,176);
    pdf.text(c.conIGV ? 'Precios incluyen IGV' : 'Precios sin IGV', W/2, fy, {align:'center'});

    const nombreArch = (q.num || 'cotizacion').replace(/[^\w\-]+/g,'_')
      + (q.cliente.nombre ? '_' + q.cliente.nombre.replace(/[^\w]+/g,'_').slice(0,24) : '') + '.pdf';
    pdf.save(nombreArch);
    mostrarToast('PDF generado · N° ' + q.num, {type:'success',duration:2800});
  } catch (err){
    console.error(err);
    mostrarToast('No se pudo generar el PDF: ' + (err.message||''), {type:'error',duration:4000});
  } finally {
    btn.disabled = false; btn.innerHTML = prev;
  }
}

/* ---------- Nueva cotización ---------- */
function nuevaCotizacion(){
  ['c-nombre','c-doc','c-dir','q-vend','q-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('chk-igv').checked = false;
  document.getElementById('lineas').innerHTML = '';
  lineas = [];
  document.getElementById('q-num').value = numeroCotizacion();
  document.getElementById('q-fecha').valueAsDate = new Date();
  agregarLinea();
  render();
  mostrarToast('Cotización nueva lista', {duration:1800});
}

function recargarCatalogos(){
  document.getElementById('hint-prod').textContent = 'Recargando...';
  cargarCatalogos();
}

/* ---------- Init ---------- */
cargarEmpresa();
// Guarda los datos de empresa al escribir
['nombre','ruc','tel','dir','email','web','bancos'].forEach(k => {
  const el = document.getElementById('e-'+k);
  if (el) el.addEventListener('input', guardarEmpresa);
});
document.getElementById('q-num').value = numeroCotizacion();
document.getElementById('q-fecha').valueAsDate = new Date();
['c-nombre','c-doc','c-dir','q-vend'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', render);
});
agregarLinea();
render();
cargarLogo();
cargarCatalogos();
</script>
